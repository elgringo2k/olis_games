  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    bodies = []; nebulae = []; gas = []; supernovae = []; particles = []; rocks = []; fragments = []; spaghettiStreams = [];
  });

  // ---- physics ----
  function step(dt){
    var n = bodies.length;
    var ax = new Array(n).fill(0), ay = new Array(n).fill(0);
    for (var i=0;i<n;i++){
      for (var j=i+1;j<n;j++){
        var dx = bodies[j].x - bodies[i].x;
        var dy = bodies[j].y - bodies[i].y;
        var distSq = dx*dx + dy*dy;
        var minD = (bodies[i].r + bodies[j].r);
        distSq = Math.max(distSq, minD*minD);
        var dist = Math.sqrt(distSq);
        var f = G / distSq;
        var fx = f * dx / dist, fy = f * dy / dist;
        ax[i] += fx * bodies[j].mass; ay[i] += fy * bodies[j].mass;
        ax[j] -= fx * bodies[i].mass; ay[j] -= fy * bodies[i].mass;
      }
    }
    for (var k=0;k<n;k++){
      bodies[k].vx += ax[k]*dt;
      bodies[k].vy += ay[k]*dt;
      bodies[k].x += bodies[k].vx*dt;
      bodies[k].y += bodies[k].vy*dt;
    }

    handleCollisions();
    updateStarTidalStress(dt);
    applyBlackHoleDisruption();
    applyRocheLimit();
    applyRedGiantDisruption();
    checkRedGiantInstability(dt);
    checkSupergiantInstability(dt);
    stepGasAndNebulae(dt);
    stepRocks(dt);
    stepFragments(dt);
    trackOrbits();
  }

  var RED_GIANT_SUPERNOVA_CHANCE = 0.000005; // 0.0005% per sim-second

  function checkRedGiantInstability(dt){
    if (dt <= 0) return;
    var exploding = [];
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (b.type !== 'redGiant') continue;
      var chance = 1 - Math.pow(1 - RED_GIANT_SUPERNOVA_CHANCE, dt);
      if (Math.random() < chance) exploding.push(b);
    }
    if (!exploding.length) return;
    bodies = bodies.filter(function(b){ return exploding.indexOf(b) === -1; });
    exploding.forEach(function(b){ spawnSupernova(b.x, b.y, b.vx, b.vy, b.r, 'neutronStar'); });
  }

  var SUPERGIANT_SUPERNOVA_CHANCE = 0.00005; // 0.005% per sim-second

  function checkSupergiantInstability(dt){
    if (dt <= 0) return;
    var exploding = [];
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (b.type !== 'supergiant') continue;
      var chance = 1 - Math.pow(1 - SUPERGIANT_SUPERNOVA_CHANCE, dt);
      if (Math.random() < chance) exploding.push(b);
    }
    if (!exploding.length) return;
    bodies = bodies.filter(function(b){ return exploding.indexOf(b) === -1; });
    exploding.forEach(function(b){ spawnSupernova(b.x, b.y, b.vx, b.vy, b.r, 'blackHole'); });
  }

  function trackOrbits(){
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      var p = b.parent;
      if (!p || bodies.indexOf(p) === -1) continue;
      var ang = Math.atan2(b.y - p.y, b.x - p.x);
      if (b.prevAng === undefined){ b.prevAng = ang; b.orbitAcc = 0; continue; }
      var d = ang - b.prevAng;
      if (d > Math.PI) d -= Math.PI*2; else if (d < -Math.PI) d += Math.PI*2;
      b.orbitAcc += d;
      b.prevAng = ang;
    }
  }

  // ---- Roche limit ----
  var ROCHE_SCALE = 5;
  var SECONDARY_TIDE = 0.25; // how strongly non-parent bodies' tides count
  function rocheLimit(primary, secondary){
    var scale = primary.type === 'blackHole' ? 8 : (primary.spots ? 1 : ROCHE_SCALE);
    return scale * primary.r * Math.cbrt(2 * primary.mass / secondary.mass);
  }

  var RED_GIANT_RIP_MASS = { star: 300, orangeDwarf: 200, redDwarf: 150 };
  var RED_GIANT_RIP_COUNT = 10;

  function updateStarTidalStress(dt){
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (!b.spots || b.type === 'blackHole' || b.type === 'neutronStar') continue; // only star-type bodies that can be consumed
      b.peakMass = Math.max(b.peakMass || b.mass, b.mass);

      var bestStress = 0, bestAng = 0, bestVt = 0;
      var bestConsumer = null, bestD = Infinity, bestReach = 0;
      for (var j=0;j<bodies.length;j++){
        if (i === j) continue;
        var q = bodies[j];
        var isConsumer = q.type === 'blackHole'
          || ((q.type === 'redGiant' || q.type === 'neutronStar') && RED_GIANT_RIP_MASS[b.type])
          || (q.spots && q.mass >= 2 * b.mass);
        if (!isConsumer) continue;
        var dx = b.x - q.x, dy = b.y - q.y;
        var d = Math.sqrt(dx*dx + dy*dy) || 1;
        var reachDist = (q.type === 'blackHole' || q.type === 'neutronStar') ? Math.max(rocheLimit(q, b), (q.r + b.r) * 1.15) : rocheLimit(q, b);
        var ratio = reachDist / d;
        var stress = Math.pow(Math.min(ratio, 3), 3);
        if (stress > bestStress){
          bestStress = stress;
          bestAng = Math.atan2(-dy, -dx);
          var rvx = b.vx - q.vx, rvy = b.vy - q.vy;
          bestVt = -Math.sin(bestAng)*rvx + Math.cos(bestAng)*rvy;
        }
        if (d < bestD && q.type !== 'supergiant'){ bestD = d; bestConsumer = q; bestReach = reachDist; }
      }
      b.tideStress = Math.min(1.5, bestStress);
      b.tideAng = bestAng;
      b.tideVt = bestVt;

      // slow tidal draining: while orbiting between 1x and 2x the disruption distance
      // (i.e. close enough to feel it, not yet close enough to be fully torn apart),
      // the star bleeds a constant 5 mass per second, visibly streaming off as gas
      // pulled toward whatever it's orbiting
      if (bestConsumer && dt > 0 && bestD >= bestReach && bestD <= bestReach*2){
        var drainRate = 5;
        var drained = Math.min(b.mass - 50, drainRate * dt);
        if (drained > 0){
          b.mass -= drained;
          growStellarBody(b);
          b.pendingDrainGas = (b.pendingDrainGas || 0) + drained;
          var chunk = 3;
          while (b.pendingDrainGas >= chunk){
            spawnDrainGasParticle(b, bestConsumer, chunk);
            b.pendingDrainGas -= chunk;
          }
        }
      }
    }
  }

  function spawnDrainGasParticle(star, consumer, mass){
    var dx = consumer.x - star.x, dy = consumer.y - star.y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    var ux = dx/d, uy = dy/d, nx = -uy, ny = ux;
    var rvx = star.vx - consumer.vx, rvy = star.vy - consumer.vy;
    var vt = rvx*nx + rvy*ny; // the star's own orbital motion, sideways to the pull — this is what gives the stream its angle
    var speed = 70 + Math.random()*35; // strong enough to actually break free of the star's own gravity well
    var gasR = Math.max(8, Math.min(120, star.r*0.03));
    var spawnSpread = (Math.random()-0.5) * star.r * 0.5;
    gas.push({
      // spawn at the leading edge facing the consumer, not buried inside the star, so it
      // isn't immediately sitting in the deepest part of the star's own gravity well
      x: star.x + ux*star.r*1.05 + nx*spawnSpread,
      y: star.y + uy*star.r*1.05 + ny*spawnSpread,
      vx: star.vx + ux*speed + nx*vt*0.5,
      vy: star.vy + uy*speed + ny*vt*0.5,
      mass: mass, r: gasR,
      hue: nebulaHues[Math.floor(Math.random()*nebulaHues.length)],
      age: 0, maxAge: NEBULA_LIFE, nebula: null,
      sourceStar: star // this particle can never fall back into the star it was pulled from
    });
    capArray(gas, 900);
  }

  function spawnGasBurst(x, y, vx, vy, totalMass, count, sourceR){
    var each = totalMass / count;
    var gasR = Math.max(10, Math.min(120, (sourceR||100) * 0.012));
    for (var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var d = Math.sqrt(Math.random()) * (sourceR||100) * 0.8;
      var speed = 20 + Math.random()*70;
      var tang = (Math.random()-0.5)*40;
      gas.push({
        x: x + Math.cos(ang)*d, y: y + Math.sin(ang)*d,
        vx: vx + Math.cos(ang)*speed - Math.sin(ang)*tang,
        vy: vy + Math.sin(ang)*speed + Math.cos(ang)*tang,
        mass: each, r: gasR,
        hue: nebulaHues[Math.floor(Math.random()*nebulaHues.length)],
        age: 0, maxAge: NEBULA_LIFE, nebula: null
      });
    }
    capArray(gas, 900);
  }

  function applyRedGiantDisruption(){
    if (bodies.length < 2) return;
    var toRemove = [];
    for (var i=0;i<bodies.length;i++){
      var rg = bodies[i];
      if (rg.type !== 'redGiant' && rg.type !== 'neutronStar' && rg.type !== 'supergiant') continue;
      for (var j=0;j<bodies.length;j++){
        if (i === j) continue;
        var tgt = bodies[j];
        if (toRemove.indexOf(tgt) !== -1) continue;
        var ripMass = RED_GIANT_RIP_MASS[tgt.type];
        if (!ripMass) continue; // only full stars, orange dwarfs, and red dwarfs can be ripped this way
        var dx = tgt.x - rg.x, dy = tgt.y - rg.y;
        var d = Math.sqrt(dx*dx + dy*dy);
        // a neutron star's own radius is tiny, so (like the black hole) its reach must be guaranteed
        // to exceed actual physical contact distance regardless of how big the target is
        var reachDist = rg.type === 'neutronStar' ? Math.max(rocheLimit(rg, tgt), (rg.r + tgt.r) * 1.15) : rocheLimit(rg, tgt);
        if (d < reachDist){
          spawnGasBurst(tgt.x, tgt.y, tgt.vx, tgt.vy, ripMass, RED_GIANT_RIP_COUNT, tgt.r);
          spawnExplosion(tgt.x, tgt.y, 30, [tgt.color, '#FFD9C2']);
          toRemove.push(tgt);
        }
      }
    }
    if (toRemove.length){
      bodies = bodies.filter(function(b){ return toRemove.indexOf(b) === -1; });
    }
  }

  var ACCRETION_FADE_TIME = 300; // 5 sim-minutes
  var DISC_INNER_MULT = 1.25, DISC_OUTER_MULT = 3.4; // must match drawBlackHole's disc radii
  var STRETCH_TIME = 1.1;  // sim-seconds: stretching in from the original body toward the disc
  var ORBIT_TIME = 4.5;    // sim-seconds: swirling around within the disc before the final plunge
  var spaghettiStreams = [];

  function spawnSpaghetti(tgt, bh){
    var count = Math.max(14, Math.min(44, Math.round(10 + tgt.mass*0.05)));
    var massShare = tgt.mass / count;

    // swirl direction follows how the star was actually moving relative to the hole (prograde capture)
    var dx0 = tgt.x - bh.x, dy0 = tgt.y - bh.y;
    var rvx = tgt.vx - bh.vx, rvy = tgt.vy - bh.vy;
    var dir = (dx0*rvy - dy0*rvx) >= 0 ? 1 : -1;
    var baseAng = Math.atan2(dy0, dx0);
    var innerR = bh.r * DISC_INNER_MULT, outerR = bh.r * DISC_OUTER_MULT;

    var particles = [];
    for (var i=0;i<count;i++){
      particles.push({
        u: count === 1 ? 0 : i/(count-1), // 0 = leading edge, 1 = trailing edge — drives the stretch stagger
        offset: (Math.random()-0.5) * tgt.r * 0.6,
        size: 1.5 + Math.random()*2.5,
        age: 0,
        delay: (count === 1 ? 0 : i/(count-1)) * STRETCH_TIME * 0.55,
        entryR: innerR + Math.random()*(outerR-innerR),
        entryAng: baseAng + (Math.random()-0.5)*0.5,
        dir: dir,
        mass: massShare,
        consumed: false
      });
    }
    spaghettiStreams.push({
      startX: tgt.x, startY: tgt.y,
      startDist: dx0*dx0 + dy0*dy0 ? Math.sqrt(dx0*dx0 + dy0*dy0) : 1,
      bh: bh, color: tgt.color,
      particles: particles
    });
    spawnExplosion(tgt.x, tgt.y, Math.min(35, 6 + tgt.mass*0.15), [tgt.color, '#FFD9A0']);
    shake = Math.min(24, shake + 6);
  }

  function updateSpaghetti(dt){
    if (dt <= 0) return;
    for (var i=spaghettiStreams.length-1;i>=0;i--){
      var s = spaghettiStreams[i];
      var bh = s.bh;
      var bhGone = bodies.indexOf(bh) === -1;
      var anyLeft = false;
      for (var k=0;k<s.particles.length;k++){
        var p = s.particles[k];
        if (p.consumed) continue;
        p.age += dt;
        var total = p.delay + STRETCH_TIME + ORBIT_TIME;
        if (p.age >= total){
          p.consumed = true;
          if (!bhGone){
            bh.mass += p.mass;
            bh.r = massToRadius(bh.mass) * (bh.sizeMultiplier || 1);
            bh.accretionT = ACCRETION_FADE_TIME;
          }
        } else {
          anyLeft = true;
        }
      }
      if (!anyLeft){
        if (!bhGone) shake = Math.min(24, shake + 4);
        spaghettiStreams.splice(i,1);
      }
    }
  }

  function drawSpaghetti(){
    if (!spaghettiStreams.length) return;
    var totalDur = STRETCH_TIME + ORBIT_TIME;
    var totalSweep = 5.0; // radians swept over the whole capture, less than one full turn
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<spaghettiStreams.length;i++){
      var s = spaghettiStreams[i];
      var bh = s.bh;
      if (bodies.indexOf(bh) === -1) continue;
      var rgb = hexToRgb(s.color);
      var startDist = s.startDist;
      var innerR = bh.r * DISC_INNER_MULT;
      for (var k=0;k<s.particles.length;k++){
        var p = s.particles[k];
        if (p.consumed) continue;
        var t = Math.max(0, p.age - p.delay);
        var u = Math.max(0, Math.min(1, t / totalDur));

        // one continuous curve: radius eases smoothly in (slow-fast-slow), angle sweeps
        // with an accelerating rate starting from zero — so there's no point where the
        // particle's direction of travel suddenly snaps from "falling" to "orbiting"
        var rEase = u*u*(3 - 2*u);
        var r = startDist + (innerR - startDist) * rEase;
        var angEase = u*u*u;
        var ang = p.entryAng + p.dir * totalSweep * angEase;

        // fading tangential jitter early on, for a bit of spread as the body first tears apart
        var jitterFade = Math.max(0, 1 - u*2.2);
        var jx = -Math.sin(ang), jy = Math.cos(ang);
        var wx = bh.x + Math.cos(ang)*r + jx*p.offset*jitterFade;
        var wy = bh.y + Math.sin(ang)*r + jy*p.offset*jitterFade;
        var heat = u;

        var sp = worldToScreen(wx, wy);
        var col = [
          Math.round(rgb[0] + (255-rgb[0])*heat),
          Math.round(rgb[1] + (225-rgb[1])*heat),
          Math.round(rgb[2] + (170-rgb[2])*heat)
        ];
        var alpha = 0.3 + 0.6*heat;
        var pr = Math.max(1, p.size * (1 - heat*0.3) * camera.zoom);
        ctx.fillStyle = 'rgba(' + col.join(',') + ',' + alpha + ')';
        ctx.beginPath(); ctx.arc(sp.x, sp.y, pr, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function applyBlackHoleDisruption(){
    if (bodies.length < 2) return;
    var toRemove = [];
    for (var i=0;i<bodies.length;i++){
      var bh = bodies[i];
      if (bh.type !== 'blackHole') continue;
      var reach = { mass: bh.mass, r: bh.r, type: 'blackHole' }; // frozen snapshot for this pass
      for (var j=0;j<bodies.length;j++){
        if (i === j) continue;
        var tgt = bodies[j];
        if (tgt.type === 'blackHole' || tgt.type === 'neutronStar') continue;
        if (toRemove.indexOf(tgt) !== -1) continue;
        var dx = tgt.x - bh.x, dy = tgt.y - bh.y;
        var d = Math.sqrt(dx*dx + dy*dy);
        var reachDist = Math.max(rocheLimit(reach, tgt), (reach.r + tgt.r) * 1.15);
        if (d < reachDist){
          spawnSpaghetti(tgt, bh);
          toRemove.push(tgt);
        }
      }
    }
    if (toRemove.length){
      bodies = bodies.filter(function(b){ return toRemove.indexOf(b) === -1; });
    }
  }


  function spawnDebris(b, primary){
    var rgb = hexToRgb(b.color);
    var dx = b.x - primary.x, dy = b.y - primary.y;
    var d = Math.sqrt(dx*dx+dy*dy) || 1;
    var tx = -dy/d, ty = dx/d;
    var count = 26 + Math.round(b.mass * 1.2);
    for (var i=0;i<count;i++){
      var along = (Math.random()-0.5) * 2;
      var spread = (Math.random()-0.5) * 40;
      particles.push({
        x: b.x + tx*along*b.r*2 + (Math.random()-0.5)*b.r,
        y: b.y + ty*along*b.r*2 + (Math.random()-0.5)*b.r,
        vx: b.vx + tx*along*60 + dx/d*spread,
        vy: b.vy + ty*along*60 + dy/d*spread,
        life: 2.5 + Math.random()*3, maxLife: 2.5 + Math.random()*3,
        size: 1 + Math.random()*2.5,
        rgb: rgb
      });
    }
    shake = Math.min(24, shake + 4);
  }

  function applyRocheLimit(){
    if (bodies.length < 2) return;
    var survivors = [];
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      var torn = false;
      if (!b.spots && b.type !== 'blackHole' && b !== grabbed){
        var primary = (b.parent && bodies.indexOf(b.parent) !== -1) ? b.parent : dominantExternal(b.x, b.y, [b]);
        // tidal stress from each heavier body ~ (rocheLimit / distance)^3; disruption when the total exceeds 1
        var stress = 0, worst = primary, worstContrib = 0, worstAng = 0;
        for (var j=0;j<bodies.length;j++){
          var q = bodies[j];
          if (q === b || q.mass < 2*b.mass) continue;
          var qx = b.x - q.x, qy = b.y - q.y;
          var qd = Math.sqrt(qx*qx+qy*qy) || 1;
          var ratio = rocheLimit(q, b) / qd;
          var contrib = ratio*ratio*ratio * (q === primary ? 1 : SECONDARY_TIDE);
          stress += contrib;
          if (contrib > worstContrib){ worstContrib = contrib; worst = q; worstAng = Math.atan2(-qy, -qx); }
        }
        b.tideStress = stress;
        b.tideAng = worstAng;
        if (worst){
          // tangential velocity relative to the tidal source (sets shear direction)
          var rvx = b.vx - worst.vx, rvy = b.vy - worst.vy;
          b.tideVt = -Math.sin(worstAng)*rvx + Math.cos(worstAng)*rvy;
        }
        if (stress > 1){ spawnTidalStream(b, worst); spawnRocks(b, worst); torn = true; }
      }
      if (!torn) survivors.push(b);
    }
    bodies = survivors;
  }

  function handleCollisions(){
    var n = bodies.length;
    if (n < 2) return;
    var parent = [];
    for (var i=0;i<n;i++) parent[i] = i;
    function find(a){ while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; }
    function union(a,b){ var ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }

    var hit = false;
    for (var i=0;i<n;i++){
      for (var j=i+1;j<n;j++){
        var dx = bodies[j].x - bodies[i].x;
        var dy = bodies[j].y - bodies[i].y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if (d < (bodies[i].r + bodies[j].r) * 0.85){
          union(i,j);
          hit = true;
        }
      }
    }
    if (!hit) return;

    var groups = {};
    for (var k=0;k<n;k++){
      var root = find(k);
      if (!groups[root]) groups[root] = [];
      groups[root].push(bodies[k]);
    }

    var survivors = [];
    Object.keys(groups).forEach(function(key){
      var group = groups[key];
      if (group.length === 1){ survivors.push(group[0]); return; }

      // neutron star mergers: they combine into one, rather than colliding explosively
      if (group.every(function(b){ return b.type === 'neutronStar'; })){
        var nm = 0, nx = 0, ny = 0, nvx = 0, nvy = 0;
        group.forEach(function(b){ nm += b.mass; nx += b.x*b.mass; ny += b.y*b.mass; nvx += b.vx*b.mass; nvy += b.vy*b.mass; });
        var p = presets.neutronStar;
        survivors.push({
          x: nx/nm, y: ny/nm, vx: nvx/nm, vy: nvy/nm,
          mass: nm, r: massToRadius(nm) * p.sizeMultiplier,
          color: p.color, sizeMultiplier: p.sizeMultiplier,
          type: 'neutronStar', spots: [], noSpots: true, bright: true, fixed: false
        });
        spawnExplosion((nx/nm), (ny/nm), Math.min(40, 10 + nm*0.02), [p.color, '#FFFFFF']);
        shake = Math.min(24, shake + 10);
        return;
      }

      var sorted = group.slice().sort(function(a,b){ return b.mass - a.mass; });
      var dominant = sorted[0];
      var runnerUp = sorted[1];

      var dvx = dominant.vx - runnerUp.vx, dvy = dominant.vy - runnerUp.vy;
      var relSpeed = Math.sqrt(dvx*dvx + dvy*dvy);
      var reducedMass = (dominant.mass * runnerUp.mass) / (dominant.mass + runnerUp.mass);
      var impactEnergy = 0.5 * reducedMass * relSpeed * relSpeed;

      var massRatio = dominant.mass / runnerUp.mass;
      var lostMass = Math.min(dominant.mass - 1, impactEnergy / (45 * Math.pow(dominant.mass, 1.75)));
      var bothStars = !!(dominant.spots && runnerUp.spots);
      var catastrophic = massRatio < 1.5 || lostMass >= dominant.mass * 0.6 || (bothStars && relSpeed >= 80);

      if (!catastrophic){
        var destroyed = sorted.slice(1);
        var destroyedMass = 0, cx = 0, cy = 0;
        destroyed.forEach(function(b){ destroyedMass += b.mass; cx += b.x*b.mass; cy += b.y*b.mass; });
        cx /= destroyedMass; cy /= destroyedMass;
        var hitIntensity = destroyedMass + Math.min(40, impactEnergy / 80);
        spawnExplosion(cx, cy, hitIntensity, destroyed.map(function(b){ return b.color; }));
        destroyed.forEach(function(b){ if (!b.spots) spawnRocks(b); });

        dominant.mass = Math.max(1, dominant.mass - lostMass);
        if (dominant.spots) growStellarBody(dominant);
        else dominant.r = massToRadius(dominant.mass) * (dominant.sizeMultiplier || 1);
        spawnExplosion(dominant.x, dominant.y, lostMass, [dominant.color]);
        survivors.push(dominant);
        return;
      }

      var totalMass = 0, ex = 0, ey = 0;
      group.forEach(function(b){ totalMass += b.mass; ex += b.x*b.mass; ey += b.y*b.mass; });
      ex /= totalMass; ey /= totalMass;
      var blastIntensity = totalMass + Math.min(70, impactEnergy / 60);
      spawnExplosion(ex, ey, blastIntensity, group.map(function(b){ return b.color; }));
      group.forEach(function(b){ if (!b.spots) spawnRocks(b); });

      var stars = group.filter(function(b){ return b.spots && b.type !== 'neutronStar'; });
      if (stars.length && relSpeed >= SUPERNOVA_SPEED){
        var sm = 0, svx = 0, svy = 0, sr = 0;
        stars.forEach(function(b){ sm += b.mass; svx += b.vx*b.mass; svy += b.vy*b.mass; sr = Math.max(sr, b.r); });
        spawnSupernova(ex, ey, svx/sm, svy/sm, sr);
      }
    });
    bodies = survivors;
  }

  function drawGrid(){
    var spacing = 200;
    var screenSpacing = spacing * camera.zoom;
    while (screenSpacing < 40) { spacing *= 5; screenSpacing = spacing * camera.zoom; }
    while (screenSpacing > 400) { spacing /= 5; screenSpacing = spacing * camera.zoom; }

    var originScreen = worldToScreen(0,0);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var startX = originScreen.x % screenSpacing;
    for (var x = startX; x < W; x += screenSpacing){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    var startY = originScreen.y % screenSpacing;
    for (var y = startY; y < H; y += screenSpacing){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
  }

  function updateParticles(dt){
    for (var i=particles.length-1; i>=0; i--){
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0){ particles.splice(i,1); continue; }
      if (!p.ring){
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.vx *= 0.96; p.vy *= 0.96;
      }
    }
    shake = Math.max(0, shake - dt*60);
  }

  function makeSpot(startAge){
    var maxLife = 240 + Math.random()*480;
    return {
      angle: Math.random()*Math.PI*2,
      dist: 0.15 + Math.random()*0.7,
      size: 0.05 + Math.random()*0.11,
      drift: (Math.random()-0.5)*0.006,
      age: (startAge || 0) * maxLife,
      maxLife: maxLife
    };
  }

  function updateSunspots(dt){
    if (dt <= 0) return;
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (b.wobble) b.wobbleT += dt;
      if (b.type === 'blackHole') b.diskRot = (b.diskRot || 0) + dt*1.1;
      if (b.accretionT != null){
        b.accretionT -= dt;
        if (b.accretionT <= 0) b.accretionT = null;
      }
      if (!b.spots) continue;
      for (var k=b.spots.length-1;k>=0;k--){
        var sp = b.spots[k];
        sp.age += dt;
        sp.angle += sp.drift*dt;
        if (sp.age >= sp.maxLife) b.spots.splice(k,1);
      }
      var spawnChance = 1 - Math.exp(-dt / 60);
      if (!b.noSpots && b.spots.length < 8 && Math.random() < spawnChance) b.spots.push(makeSpot(0));
    }
  }

  // traces a wobbling outline for unstable stars (a plain circle otherwise)
  function starOutline(cx, cy, rad, b){
    ctx.beginPath();
    var hasWobble = !!b.wobble;
    var tst = Math.max(0, Math.min(1, ((b.tideStress || 0) - 0.1) / 0.9));
    var hasTide = tst > 0.004;
    if (!hasWobble && !hasTide){ ctx.arc(cx, cy, rad, 0, Math.PI*2); return; }

    var near = 0, far = 0, squeeze = 1, shear = 0, ang = 0;
    if (hasTide){
      near = 1.1*tst*tst;
      far = 0.5*tst*tst;
      squeeze = 1 / Math.sqrt(1 + (near+far)*0.5);
      shear = 0.4*tst*tst * (b.tideVt >= 0 ? 1 : -1);
      ang = b.tideAng || 0;
    }

    var N = 140;
    for (var i=0;i<N;i++){
      var th = (i/N) * Math.PI*2;
      var rr2 = rad;
      if (hasWobble){
        for (var h=0; h<b.wobble.length; h++){
          var w = b.wobble[h];
          rr2 += rad * w.amp * Math.sin(w.freq*th + w.phase + w.speed*b.wobbleT);
        }
      }
      if (hasTide){
        var rel = th - ang - shear*0.6;
        var c = Math.cos(rel);
        var bulgeFrac = (c+1)/2; // 1 = facing the consumer (near side), 0 = far side
        var bulgeAmt = far + (near-far)*bulgeFrac;
        var sq = 1 - (1-squeeze)*(1-c*c); // squeeze is strongest at the equator (rel = ±90°)
        rr2 = rr2*sq*(1+bulgeAmt);
      }
      var x = cx + Math.cos(th)*rr2, y = cy + Math.sin(th)*rr2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function hsla(h, s, l, a){ return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')'; }

  function drawBlackHole(b, s, rr){
    if (b.accretionT != null){
      var t = Math.max(0, Math.min(1, b.accretionT / ACCRETION_FADE_TIME));
      var innerR = rr*DISC_INNER_MULT, outerR = rr*DISC_OUTER_MULT;
      var rot = b.diskRot || 0;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.globalCompositeOperation = 'lighter';

      // base glow: hot blue-white near the hole, cooling to orange-red at the outer edge
      var dg = ctx.createRadialGradient(0, 0, innerR, 0, 0, outerR);
      dg.addColorStop(0, 'rgba(215,235,255,' + (0.95*t) + ')');
      dg.addColorStop(0.28, 'rgba(255,235,180,' + (0.75*t) + ')');
      dg.addColorStop(0.6, 'rgba(255,160,80,' + (0.5*t) + ')');
      dg.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(0, 0, outerR, 0, Math.PI*2);
      ctx.arc(0, 0, innerR, 0, Math.PI*2, true);
      ctx.fill();

      // rotating turbulent streaks — this is what actually sells the spin
      var streaks = 12;
      for (var k=0;k<streaks;k++){
        var seed = (k*57) % 100 / 100;
        var ang = (k/streaks)*Math.PI*2 + rot*(1 + seed*0.15);
        var midR = innerR + (outerR-innerR) * (0.25 + 0.65*seed);
        var arcLen = 0.28 + 0.22*seed;
        var bandW = Math.max(1.5, (outerR-innerR) * (0.10 + 0.08*seed));
        ctx.beginPath();
        ctx.arc(0, 0, midR, ang, ang+arcLen);
        ctx.strokeStyle = 'rgba(255,240,205,' + (t*(0.35+0.35*seed)) + ')';
        ctx.lineWidth = bandW;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // a bright hot-spot orbiting within the disc for extra visual "spin" cue
      var hsR = outerR*0.68;
      var hsx = hsR*Math.cos(rot*1.7), hsy = hsR*Math.sin(rot*1.7);
      var eg = ctx.createRadialGradient(hsx, hsy, 0, hsx, hsy, innerR*1.6);
      eg.addColorStop(0, 'rgba(255,255,255,' + (0.65*t) + ')');
      eg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(0, 0, outerR, 0, Math.PI*2); ctx.fill();

      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(s.x, s.y, rr, 0, Math.PI*2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    // thin bright photon ring at the very edge of the event horizon
    var rim = ctx.createRadialGradient(s.x, s.y, rr*0.82, s.x, s.y, rr*1.05);
    rim.addColorStop(0, 'rgba(255,245,225,0)');
    rim.addColorStop(0.88, 'rgba(255,245,225,0.85)');
    rim.addColorStop(1, 'rgba(255,245,225,0)');
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(s.x, s.y, rr*1.05, 0, Math.PI*2); ctx.fill();
  }

  function nebulaState(nb){
    var t = nb.age / nb.maxAge;
    var fadeIn = Math.min(1, nb.age / 25);
    var alpha = fadeIn * Math.pow(1 - t, 1.3);
    var expand = (1.2 + 6 * t) * 10;
    return { alpha: alpha, R: nb.baseR * expand, t: t };
  }

  function drawNebulae(){
    if (!nebulae.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<nebulae.length;i++){
      var nb = nebulae[i];
      var ns = nebulaState(nb);
      var alpha = ns.alpha, R = ns.R, t = ns.t;
      if (alpha <= 0.003) continue;
      var sc = worldToScreen(nb.x, nb.y);
      var Rs = R * camera.zoom;
      if (sc.x < -Rs*1.3 || sc.x > W + Rs*1.3 || sc.y < -Rs*1.3 || sc.y > H + Rs*1.3) continue;
      if (Rs < 2) continue;

      for (var k=0;k<nb.blobs.length;k++){
        var bl = nb.blobs[k];
        var ang = bl.a + nb.rot * bl.spin;
        var bx = sc.x + Math.cos(ang) * bl.d * Rs;
        var by = sc.y + Math.sin(ang) * bl.d * Rs;
        var br = bl.r * Rs;
        if (br < 1.5) continue;
        var a = bl.alpha * alpha * 0.75;
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(bl.tilt + nb.rot * 0.5);
        ctx.scale(bl.stretch, 1 / bl.stretch);
        var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, br);
        grad.addColorStop(0, hsla(bl.hue, 90, 70, a));
        grad.addColorStop(0.35, hsla(bl.hue, 85, 55, a * 0.55));
        grad.addColorStop(0.7, hsla(bl.hue + 20, 80, 45, a * 0.18));
        grad.addColorStop(1, hsla(bl.hue, 80, 40, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, br, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // bright, slowly cooling core
      var coreA = alpha * Math.pow(1 - t, 2) * 0.7;
      if (coreA > 0.01){
        var cg = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, Rs*0.35);
        cg.addColorStop(0, 'rgba(255,250,235,' + coreA + ')');
        cg.addColorStop(0.4, hsla(45, 100, 75, coreA*0.5));
        cg.addColorStop(1, hsla(300, 90, 60, 0));
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(sc.x, sc.y, Rs*0.35, 0, Math.PI*2); ctx.fill();
      }

      // faint expanding shell
      var shellA = alpha * (1 - t) * 0.22;
      if (shellA > 0.01 && Rs > 12){
        ctx.beginPath();
        ctx.arc(sc.x, sc.y, Rs*0.92, 0, Math.PI*2);
        ctx.strokeStyle = hsla(195, 90, 70, shellA);
        ctx.lineWidth = Math.max(1, Rs*0.06);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawGas(){
    if (!gas.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<gas.length;i++){
      var p = gas[i];
      var sp = worldToScreen(p.x, p.y);
      var pr = p.r * camera.zoom;
      if (sp.x < -pr || sp.x > W+pr || sp.y < -pr || sp.y > H+pr) continue;
      var t = p.age / p.maxAge;
      var fade = (t > 0.75 ? (1 - t) / 0.25 : 1) * Math.min(1, p.age / 3 + 0.3);
      if (pr < 1.2){
        ctx.fillStyle = hsla(p.hue, 90, 75, 0.7*fade);
        ctx.fillRect(sp.x, sp.y, 1.5, 1.5);
        continue;
      }
      // flat fills instead of a per-particle gradient — creating a radial gradient object
      // for every one of up to 900 particles, every frame, is a real performance cliff
      ctx.fillStyle = hsla(p.hue, 88, 58, 0.32*fade);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, pr, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = hsla(p.hue, 95, 82, 0.5*fade);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, pr*0.45, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawSupernovae(){
    if (!supernovae.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<supernovae.length;i++){
      var sn = supernovae[i];
      var t = sn.age / sn.maxAge;
      var sc = worldToScreen(sn.x, sn.y);
      var r = sn.r * camera.zoom;

      // white-hot core: explodes outward quickly, then dims
      var coreGrow = 1 - Math.exp(-t * 9);
      var coreR = r * (0.4 + 2.2 * coreGrow);
      var coreA = Math.pow(1 - t, 1.6);
      var cg = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, coreR);
      cg.addColorStop(0, 'rgba(255,255,255,' + coreA + ')');
      cg.addColorStop(0.25, 'rgba(255,245,210,' + coreA*0.9 + ')');
      cg.addColorStop(0.55, hsla(35, 100, 65, coreA*0.5));
      cg.addColorStop(1, hsla(300, 90, 60, 0));
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(sc.x, sc.y, coreR, 0, Math.PI*2); ctx.fill();

      // primary shockwave: thin, blistering fast
      var sw1 = r * (0.6 + 8 * t);
      var sw1A = Math.pow(1 - t, 1.2) * 0.95;
      ctx.beginPath(); ctx.arc(sc.x, sc.y, sw1, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,' + sw1A + ')';
      ctx.lineWidth = Math.max(1.5, r*0.05*(1-t));
      ctx.stroke();
      ctx.beginPath(); ctx.arc(sc.x, sc.y, sw1*0.985, 0, Math.PI*2);
      ctx.strokeStyle = hsla(195, 100, 75, sw1A*0.7);
      ctx.lineWidth = Math.max(1, r*0.12*(1-t));
      ctx.stroke();

      // secondary, slower, hotter shell
      var sw2 = r * (0.3 + 5 * t*t);
      var sw2A = Math.sin(Math.PI * Math.min(1, t*1.15)) * 0.8;
      ctx.beginPath(); ctx.arc(sc.x, sc.y, sw2, 0, Math.PI*2);
      ctx.strokeStyle = hsla(25, 100, 60, sw2A);
      ctx.lineWidth = Math.max(1.5, r*0.2*(1-t));
      ctx.stroke();

      // radial ejecta rays
      var rays = 28;
      var rayLen = r * (0.8 + 6.5 * t);
      var rayA = Math.pow(1 - t, 1.4) * 0.75;
      for (var k=0;k<rays;k++){
        var ang = sn.spin + (k / rays) * Math.PI*2 + Math.sin(k*7.3) * 0.08;
        var len = rayLen * (0.55 + 0.45 * Math.abs(Math.sin(k*3.1 + sn.spin)));
        var hue = [45, 20, 300, 195, 330][k % 5];
        var x0 = sc.x + Math.cos(ang) * r * 0.2, y0 = sc.y + Math.sin(ang) * r * 0.2;
        var x1 = sc.x + Math.cos(ang) * len, y1 = sc.y + Math.sin(ang) * len;
        var lg = ctx.createLinearGradient(x0, y0, x1, y1);
        lg.addColorStop(0, hsla(hue, 100, 85, rayA));
        lg.addColorStop(0.5, hsla(hue, 100, 65, rayA*0.5));
        lg.addColorStop(1, hsla(hue, 100, 55, 0));
        ctx.strokeStyle = lg;
        ctx.lineWidth = Math.max(1, r*0.035*(1-t));
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---- orbit path rendering ----
  function keplerElements(rx, ry, vx, vy, mu){
    var r = Math.sqrt(rx*rx + ry*ry);
    if (r < 1e-6) return null;
    var v2 = vx*vx + vy*vy;
    var eps = v2/2 - mu/r;
    if (eps >= 0) return null; // unbound
    var a = -mu / (2*eps);
    var rv = rx*vx + ry*vy;
    var ex = ((v2 - mu/r)*rx - rv*vx) / mu;
    var ey = ((v2 - mu/r)*ry - rv*vy) / mu;
    var e = Math.sqrt(ex*ex + ey*ey);
    if (e >= 0.999) return null;
    return { a:a, b:a*Math.sqrt(1 - e*e), ex:ex, ey:ey, e:e };
  }

  // draw ellipse with focus at (fx,fy); scale shrinks it, flip mirrors it through the focus
  function drawEllipse(fx, fy, el, scale, flip, style, width, dash){
    var s = flip ? -scale : scale;
    var a = el.a*scale, b = el.b*scale;
    // center = focus minus (a · e-vector), mirrored through the focus when flipped
    var cx = fx - el.ex*el.a*s, cy = fy - el.ey*el.a*s;
    var sc = worldToScreen(cx, cy);
    var ra = a*camera.zoom, rb = b*camera.zoom;
    if (ra < 2) return;
    if (sc.x + ra < 0 || sc.x - ra > W || sc.y + ra < 0 || sc.y - ra > H) return;
    ctx.beginPath();
    ctx.ellipse(sc.x, sc.y, ra, rb, Math.atan2(el.ey, el.ex), 0, Math.PI*2);
    ctx.strokeStyle = style;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke();
    if (dash) ctx.setLineDash([]);
  }

  function dominantExternal(x, y, exclude){
    var best = null, bestPull = -1;
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (exclude.indexOf(b) !== -1) continue;
      var dx = x - b.x, dy = y - b.y;
      var pull = b.mass / Math.max(dx*dx + dy*dy, b.r*b.r);
      if (pull > bestPull){ bestPull = pull; best = b; }
    }
    return best;
  }

  // two bodies are a binary when they're mutually bound and their orbit fits inside
  // their Hill sphere relative to the strongest outside body
  function findBinaries(){
    var pairs = [], used = [];
    for (var i=0;i<bodies.length;i++){
      for (var j=i+1;j<bodies.length;j++){
        var a = bodies[i], b = bodies[j];
        if (used.indexOf(a) !== -1 || used.indexOf(b) !== -1) continue;
        if (Math.max(a.mass, b.mass) / Math.min(a.mass, b.mass) >= 2) continue; // lopsided pair, not a binary
        var M = a.mass + b.mass;
        var rel = keplerElements(b.x-a.x, b.y-a.y, b.vx-a.vx, b.vy-a.vy, G*M);
        if (!rel) continue;
        var bx = (a.x*a.mass + b.x*b.mass)/M, by = (a.y*a.mass + b.y*b.mass)/M;
        var ext = dominantExternal(bx, by, [a, b]);
        if (ext){
          var d = Math.hypot(bx-ext.x, by-ext.y);
          var hill = d * Math.cbrt(M / (3*ext.mass));
          if (rel.a*(1+rel.e) > hill) continue;
        }
        pairs.push({ a:a, b:b, rel:rel, bx:bx, by:by, M:M, ext:ext });
        used.push(a, b);
      }
    }
    return { pairs: pairs, used: used };
  }

  // barycentre of a body together with everything orbiting it (recursively)
  function systemState(b){
    var m = b.mass, x = b.x*b.mass, y = b.y*b.mass, vx = b.vx*b.mass, vy = b.vy*b.mass;
    for (var i=0;i<bodies.length;i++){
      var c = bodies[i];
      if (c.parent === b && c !== b){
        var cs = systemState(c);
        m += cs.mass; x += cs.x*cs.mass; y += cs.y*cs.mass; vx += cs.vx*cs.mass; vy += cs.vy*cs.mass;
      }
    }
    return { mass: m, x: x/m, y: y/m, vx: vx/m, vy: vy/m };
  }

  function drawOrbitPaths(){
    var bin = findBinaries();

    for (var k=0;k<bin.pairs.length;k++){
      var pr = bin.pairs[k];
      var ca = hexToRgb(pr.a.color), cb = hexToRgb(pr.b.color);
      // each partner's ellipse around the barycentre
      drawEllipse(pr.bx, pr.by, pr.rel, pr.b.mass/pr.M, true,  'rgba(' + ca.join(',') + ',0.35)', 1);
      drawEllipse(pr.bx, pr.by, pr.rel, pr.a.mass/pr.M, false, 'rgba(' + cb.join(',') + ',0.35)', 1);
      // barycentre marker
      var bs = worldToScreen(pr.bx, pr.by);
      ctx.beginPath(); ctx.arc(bs.x, bs.y, 3, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
      // barycentre's own orbit around the outside body
      if (pr.ext){
        var bvx = (pr.a.vx*pr.a.mass + pr.b.vx*pr.b.mass)/pr.M;
        var bvy = (pr.a.vy*pr.a.mass + pr.b.vy*pr.b.mass)/pr.M;
        var el = keplerElements(pr.bx-pr.ext.x, pr.by-pr.ext.y, bvx-pr.ext.vx, bvy-pr.ext.vy, G*(pr.ext.mass + pr.M));
        if (el){
          var mix = [Math.round((ca[0]+cb[0])/2), Math.round((ca[1]+cb[1])/2), Math.round((ca[2]+cb[2])/2)];
          drawEllipse(pr.ext.x, pr.ext.y, el, 1, false, 'rgba(' + mix.join(',') + ',0.55)', 1.5, [6,6]);
        }
      }
    }

    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (bin.used.indexOf(b) !== -1) continue;
      var p = b.parent;
      if (!p) continue;
      if (bodies.indexOf(p) === -1){ b.parent = null; continue; }
      var st = systemState(b);
      var el2 = keplerElements(st.x-p.x, st.y-p.y, st.vx-p.vx, st.vy-p.vy, G*(p.mass + st.mass));
      if (!el2) continue;
      var rgb = hexToRgb(b.color);
      drawEllipse(p.x, p.y, el2, 1, false, 'rgba(' + rgb.join(',') + ',0.35)', 1);
    }
  }

  var selected = null;
  var infoEl = document.getElementById('info');
  var panelEl = document.getElementById('panel');
  var panelTitle = document.getElementById('panelTitle');
  var portraitCv = document.getElementById('portrait');
  var portraitCtx = portraitCv.getContext('2d');
  document.getElementById('panelClose').addEventListener('click', function(){ selected = null; });
  var typeNames = { moon: 'Moon', planet: 'Planet', gasGiant: 'Gas giant', star: 'Star', redGiant: 'Red giant', supergiant: 'Supergiant', neutronStar: 'Neutron star', blackHole: 'Black hole', orangeDwarf: 'Orange dwarf', redDwarf: 'Red dwarf' };
  function typeName(b){ return typeNames[b.type] || (b.spots ? 'Star' : 'Body'); }

  function renderPortrait(b){
    var size = portraitCv.width;
    var savedCtx = ctx, savedCam = camera, savedW = W, savedH = H;
    ctx = portraitCtx; W = size; H = size;
    camera = { x: b.x, y: b.y, zoom: (size * 0.36) / b.r };
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, size, size);
    // subtle backdrop of nearby space so lighting reads
    drawBody(b, true);
    ctx = savedCtx; camera = savedCam; W = savedW; H = savedH;
  }

  function updateInfoPanel(){
    if (selected && bodies.indexOf(selected) === -1) selected = null;
    if (!selected){ panelEl.style.display = 'none'; return; }
    var b = selected;
    panelTitle.textContent = typeName(b);
    renderPortrait(b);
    var lines = [];
    if (b.planetZone){
      var zoneLabel = (PLANET_ZONES.concat(GAS_GIANT_KINDS, MOON_KINDS).filter(function(z){ return z.type === b.planetZone; })[0] || {}).label;
      if (zoneLabel) lines.push('Composition: <b>' + zoneLabel + '</b>');
    }
    lines.push('Mass: <b>' + (Math.round(b.mass*10)/10) + '</b>');
    lines.push('Speed: <b>' + Math.round(Math.hypot(b.vx, b.vy)) + '</b>');
    lines.push('Radius: <b>' + Math.round(b.r) + '</b>');
    if (b.parent && bodies.indexOf(b.parent) !== -1){
      var orbits = b.orbitAcc !== undefined ? Math.floor(Math.abs(b.orbitAcc)/(Math.PI*2)) : 0;
      var dist = Math.round(Math.hypot(b.x - b.parent.x, b.y - b.parent.y));
      lines.push('Orbits: <b>' + typeName(b.parent) + '</b> at ' + dist + ' (' + orbits + ' completed)');
    } else {
      lines.push('Orbits: nothing');
    }
    var kids = bodies.filter(function(c){ return c.parent === b; });
    if (kids.length){
      var counts = {};
      kids.forEach(function(c){ var n = typeName(c); counts[n] = (counts[n]||0) + 1; });
      lines.push('Orbited by: <b>' + Object.keys(counts).map(function(k){ return counts[k] + ' ' + k.toLowerCase() + (counts[k] > 1 ? 's' : ''); }).join(', ') + '</b>');
    } else {
      lines.push('Orbited by: nothing');
    }
    if (b.rings && b.rings.count){
      lines.push('Rings: <b>' + b.rings.count + ' pieces</b>');
    }
    if (!b.spots && b.tideStress !== undefined){
      lines.push('Tidal stress: <b>' + Math.round(Math.min(1, b.tideStress) * 100) + '%</b>');
    }
    infoEl.innerHTML = lines.join('<br>');
    panelEl.style.display = 'flex';
  }

  function drawSelection(){
    if (!selected) return;
    var s = worldToScreen(selected.x, selected.y);
    var r = Math.max(6, selected.r*camera.zoom) + 8;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ---- tidal deformation helpers ----
  function tidalShape(b, t){
    if (t <= 0) return null;
    var near = 1.1 * t*t;          // bulge toward the primary
    var far  = 0.5 * t*t;          // smaller bulge away from it
    var squeeze = 1 / Math.sqrt(1 + (near + far) * 0.5);
    var vt = b.tideVt || 0;
    var shear = 0.55 * t*t * Math.sign(vt) * Math.min(1, Math.abs(vt) / 15);
    return { ang: b.tideAng || 0, near: near, far: far, squeeze: squeeze, shear: shear };
  }

  // traces the (possibly deformed) outline as the current path
  function bodyPath(cx, cy, rr, d){
    ctx.beginPath();
    if (!d){ ctx.arc(cx, cy, rr, 0, Math.PI*2); return; }
    var ca = Math.cos(d.ang), sa = Math.sin(d.ang);
    var N = 40;
    for (var i=0;i<N;i++){
      var th = (i / N) * Math.PI*2;
      var x = Math.cos(th), y = Math.sin(th);
      x = x > 0 ? x * (1 + d.near) : x * (1 + d.far);
      y = y * d.squeeze + d.shear * x;
      var px = cx + (x*ca - y*sa) * rr;
      var py = cy + (x*sa + y*ca) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // the star lighting a body most strongly: its light level (sqrt of flux) and direction
  function brightestStar(b){
    var best = null;
    for (var i=0;i<bodies.length;i++){
      var st = bodies[i];
      if (!st.spots && st.type !== 'blackHole') continue;
      var dx = st.x - b.x, dy = st.y - b.y;
      var d = Math.sqrt(dx*dx+dy*dy) || 1;
      var lightMass = st.type === 'blackHole' ? 70 : st.mass;
      var light = Math.sqrt((lightMass/1500) * Math.pow(25000/d, 2));
      if (!best || light > best.light) best = { light: light, ux: dx/d, uy: dy/d };
    }
    return best;
  }

  function drawBody(b, portrait){
    var s = worldToScreen(b.x, b.y);
    var r = b.r * camera.zoom;
    var glowR = b.type === 'blackHole' ? r*3.5 : (b.bright ? r*22 : (b.spots ? r*2.4 : r));
    if (!portrait && (s.x < -glowR || s.x > W+glowR || s.y < -glowR || s.y > H+glowR)) return;
    var rr = Math.max(1.5, r);
    var rgb = hexToRgb(b.color);

      drawRings(b, s, r);

      if (b.type === 'blackHole'){
        drawBlackHole(b, s, rr);
      } else if (b.spots){
        var isBright = !!b.bright;
        // glow halo — neutron stars are tiny but pack a far more intense, wide-reaching glow
        var gR = isBright ? r*20 : Math.max(r*2.4, r + 6);
        if (gR > 0.1){
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          var hg = ctx.createRadialGradient(s.x, s.y, r*(isBright?0.3:0.6), s.x, s.y, gR);
          hg.addColorStop(0, 'rgba(' + rgb.join(',') + ',' + (isBright?0.9:0.55) + ')');
          hg.addColorStop(0.15, 'rgba(' + rgb.join(',') + ',' + (isBright?0.5:0.28) + ')');
          hg.addColorStop(1, 'rgba(' + rgb.join(',') + ',0)');
          ctx.fillStyle = hg;
          ctx.beginPath(); ctx.arc(s.x, s.y, gR, 0, Math.PI*2); ctx.fill();
          if (isBright && r*4 > 0.1){
            // a second, tighter blaze so the point source itself reads as blindingly hot
            var hg2 = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r*4);
            hg2.addColorStop(0, 'rgba(255,255,255,0.95)');
            hg2.addColorStop(0.4, 'rgba(255,255,255,0.35)');
            hg2.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hg2;
            ctx.beginPath(); ctx.arc(s.x, s.y, r*4, 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
        }

        starOutline(s.x, s.y, rr, b);
        ctx.fillStyle = isBright ? '#FFFFFF' : b.color;
        ctx.fill();
        // hot rim
        var rim = ctx.createRadialGradient(s.x, s.y, rr*0.55, s.x, s.y, rr);
        rim.addColorStop(0, 'rgba(255,255,255,0)');
        rim.addColorStop(1, 'rgba(255,255,255,' + (isBright?0.5:0.22) + ')');
        ctx.fillStyle = rim;
        starOutline(s.x, s.y, rr, b);
        ctx.fill();
      } else {
        // tidal deformation: near side bulges faster than the far side, and orbital
        // shear skews the bulge sideways (inner material orbits faster than outer)
        var tst = Math.max(0, Math.min(1, ((b.tideStress || 0) - 0.3) / 0.7));
        var deform = tidalShape(b, tst);
        if (b.hot){
          // hot giants glow with their own heat
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          var hgl = ctx.createRadialGradient(s.x, s.y, rr*0.8, s.x, s.y, rr*1.6);
          hgl.addColorStop(0, 'rgba(255,110,30,0.45)');
          hgl.addColorStop(1, 'rgba(255,60,10,0)');
          ctx.fillStyle = hgl;
          ctx.beginPath(); ctx.arc(s.x, s.y, rr*1.6, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
        ctx.save();

        // surface: baked procedural texture if this body has a composition, else flat dark base
        bodyPath(s.x, s.y, rr, deform);
        ctx.clip();
        var planetTex = b.planetZone ? getPlanetTexture(b.planetZone, b.texVariant || 0) : null;
        if (planetTex){
          ctx.save();
          ctx.translate(s.x, s.y);
          if (deform){
            // build the warp in the same frame bodyPath uses (axis-aligned, then rotated
            // to the true tidal direction), with the texture's own random spin applied
            // innermost so it doesn't fight the warp orientation
            ctx.rotate(deform.ang);
            var stretchAlong = 1 + Math.max(deform.near, deform.far);
            ctx.transform(stretchAlong, deform.shear*stretchAlong, 0, deform.squeeze, 0, 0);
            ctx.rotate(b.texAngle || 0);
          } else {
            ctx.rotate(b.texAngle || 0);
          }
          ctx.drawImage(planetTex, -rr, -rr, rr*2, rr*2);
          ctx.restore();
          // ambient darken: night side starts dim, texture still faintly visible
          ctx.globalCompositeOperation = 'multiply';
          var night = b.hot ? [190,160,150] : [46,44,50]; // hot giants' night side still glows
          var giantSun = b.type === 'gasGiant' ? brightestStar(b) : null;
          if (giantSun){
            // gas giants: darken only the night side, so the day side shows the cloud bands in full
            // colour instead of being washed out by an additive glow
            var L = Math.min(1, Math.sqrt(giantSun.light) * 1.6); // gentle falloff so far-out giants stay well lit
            var day = night.map(function(v, k){ return Math.round(v + ([255,250,240][k] - v) * L); });
            var gl = ctx.createLinearGradient(s.x + giantSun.ux*rr, s.y + giantSun.uy*rr, s.x - giantSun.ux*rr, s.y - giantSun.uy*rr);
            gl.addColorStop(0, 'rgb(' + day.join(',') + ')');
            gl.addColorStop(0.45, 'rgb(' + day.join(',') + ')');
            gl.addColorStop(0.62, 'rgb(' + night.join(',') + ')');
            gl.addColorStop(1, 'rgb(' + night.join(',') + ')');
            ctx.fillStyle = gl;
          } else {
            ctx.fillStyle = 'rgb(' + night.join(',') + ')';
          }
          ctx.fillRect(s.x-rr*2.5, s.y-rr*2.5, rr*5, rr*5);
          ctx.globalCompositeOperation = 'source-over';
        } else {
          ctx.fillStyle = 'rgb(' + Math.round(rgb[0]*0.16) + ',' + Math.round(rgb[1]*0.16) + ',' + Math.round(rgb[2]*0.16) + ')';
          ctx.fillRect(s.x-rr*2.5, s.y-rr*2.5, rr*5, rr*5);
        }

        // lit hemisphere from each star
        ctx.save();
        bodyPath(s.x, s.y, rr, deform); ctx.clip();
        ctx.globalCompositeOperation = 'lighter';
        for (var si2=0; si2<bodies.length; si2++){
          var st = bodies[si2];
          if (!st.spots && st.type !== 'blackHole') continue;
          var dx = st.x - b.x, dy = st.y - b.y;
          var d = Math.sqrt(dx*dx+dy*dy) || 1;
          var lightMass = st.type === 'blackHole' ? 70 : st.mass; // black holes only give off a faint glow
          var flux = (lightMass/1500) * Math.pow(25000/d, 2);
          var inten = Math.min(1, Math.sqrt(flux)) * (planetTex ? (giantSun ? 0.15 : 0.55) : 0.95); // giants already lit above; just a soft sheen
          if (inten < 0.02) continue;
          var ux = dx/d, uy = dy/d;
          var relight = planetTex ? '255,246,225' : rgb.join(',');
          var lg = ctx.createLinearGradient(s.x + ux*rr, s.y + uy*rr, s.x - ux*rr*0.25, s.y - uy*rr*0.25);
          lg.addColorStop(0, 'rgba(' + relight + ',' + inten + ')');
          lg.addColorStop(0.55, 'rgba(' + relight + ',' + (inten*0.5) + ')');
          lg.addColorStop(1, 'rgba(' + relight + ',0)');
          ctx.fillStyle = lg;
          ctx.fillRect(s.x - rr*3, s.y - rr*3, rr*6, rr*6);
        }
        ctx.restore();

        // nebula ambient glow: uniform light from all sides if the body sits inside a nebula
        if (nebulae.length){
          ctx.save();
          bodyPath(s.x, s.y, rr, deform); ctx.clip();
          ctx.globalCompositeOperation = 'lighter';
          for (var ni=0; ni<nebulae.length; ni++){
            var nb = nebulae[ni];
            var ns = nebulaState(nb);
            if (ns.alpha <= 0.01) continue;
            var ndx = b.x - nb.x, ndy = b.y - nb.y;
            var ndist = Math.sqrt(ndx*ndx + ndy*ndy);
            if (ndist > ns.R) continue;
            var depthIn = 1 - ndist/ns.R;         // 0 at edge of cloud, 1 at centre
            var glowA = ns.alpha * (0.12 + 0.28*depthIn);
            if (glowA < 0.01) continue;
            ctx.fillStyle = hsla(nb.glowHue, 80, 68, glowA);
            ctx.fillRect(s.x - rr, s.y - rr, rr*2, rr*2);
          }
          ctx.restore();
        }

        // eclipses: on every 5th orbit a moon casts its shadow across the planet
        if (r > 4){
          var brightest = null, bestFlux = 0;
          for (var bs2=0; bs2<bodies.length; bs2++){
            var stq = bodies[bs2];
            if (!stq.spots && stq.type !== 'blackHole') continue;
            var qdx = stq.x - b.x, qdy = stq.y - b.y;
            var qd2 = qdx*qdx + qdy*qdy || 1;
            var fq = (stq.type === 'blackHole' ? 70 : stq.mass) / qd2;
            if (fq > bestFlux){ bestFlux = fq; brightest = stq; }
          }
          if (brightest){
            var sdx = brightest.x - b.x, sdy = brightest.y - b.y;
            var sd = Math.sqrt(sdx*sdx+sdy*sdy) || 1;
            var ux2 = sdx/sd, uy2 = sdy/sd;
            for (var mi=0; mi<bodies.length; mi++){
              var mn = bodies[mi];
              if (mn.parent !== b || mn.orbitAcc === undefined) continue;
              var orbits = Math.floor(Math.abs(mn.orbitAcc) / (Math.PI*2));
              if (orbits % 5 !== 4) continue;
              var mx = mn.x - b.x, my = mn.y - b.y;
              var along = mx*ux2 + my*uy2;
              if (along <= 0) continue; // moon must be on the star side
              var px2 = mx - along*ux2, py2 = my - along*uy2;
              var perp = Math.sqrt(px2*px2 + py2*py2);
              // closer moon -> bigger, sharper umbra; farther -> small umbra, wide penumbra
              var shadowScale = Math.max(0.35, Math.min(1.6, 1.6 - along / (10*b.r)));
              var umbraR = mn.r * shadowScale;
              var penR = umbraR * 1.9 + mn.r * 0.4;
              if (perp > b.r + penR) continue;
              var depth = Math.sqrt(Math.max(0, b.r*b.r - Math.min(perp, b.r)*Math.min(perp, b.r)));
              var hx = b.x + px2 + ux2*depth, hy = b.y + py2 + uy2*depth;
              var hs = worldToScreen(hx, hy);
              ctx.save();
              bodyPath(s.x, s.y, rr, deform); ctx.clip();
              ctx.globalCompositeOperation = 'multiply';
              var eg = ctx.createRadialGradient(hs.x, hs.y, 0, hs.x, hs.y, penR*camera.zoom);
              eg.addColorStop(0, 'rgba(35,33,38,1)');
              eg.addColorStop(Math.min(0.99, umbraR/penR), 'rgba(35,33,38,1)');
              eg.addColorStop(1, 'rgba(35,33,38,0)');
              ctx.fillStyle = eg;
              ctx.beginPath(); ctx.arc(hs.x, hs.y, penR*camera.zoom, 0, Math.PI*2); ctx.fill();
              ctx.restore();
            }
          }
        }
        ctx.restore();
      }

      if (b.spots && r > 10){
        ctx.save();
        starOutline(s.x, s.y, r, b);
        ctx.clip();
        for (var si=0; si<b.spots.length; si++){
          var sp = b.spots[si];
          var t = sp.age / sp.maxLife;
          var env = Math.sin(Math.PI * t);
          var sr = sp.size * r * env;
          if (sr < 0.5) continue;
          var sx = s.x + Math.cos(sp.angle) * sp.dist * r;
          var sy = s.y + Math.sin(sp.angle) * sp.dist * r;
          var isDwarf = b.type === 'redDwarf' || b.type === 'supergiant' || (b.type === 'orangeDwarf' && b.mass < 1200);
          ctx.beginPath();
          ctx.arc(sx, sy, sr*1.7, 0, Math.PI*2);
          ctx.fillStyle = isDwarf
            ? 'rgba(45,45,50,' + (0.6*env) + ')'
            : 'rgba(160,80,20,' + (0.45*env) + ')';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI*2);
          ctx.fillStyle = isDwarf
            ? 'rgba(0,0,0,' + env + ')'
            : 'rgba(70,30,10,' + (0.85*env) + ')';
          ctx.fill();
        }
        ctx.restore();
      }

      if (b.fixed && !portrait){
        ctx.beginPath();
        ctx.arc(s.x, s.y, Math.max(1.5,r) + 4, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.setLineDash([3,4]);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);
      }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake > 0.1){
      shakeOffX = (Math.random()-0.5)*shake;
      shakeOffY = (Math.random()-0.5)*shake;
      ctx.translate(shakeOffX, shakeOffY);
    } else {
      shakeOffX = 0; shakeOffY = 0;
    }
    drawGrid();
    drawNebulae();
    drawOrbitPaths();
    drawSelection();

    for (var i=0;i<bodies.length;i++) drawBody(bodies[i], false);

    if (grabbed && grabStart && grabCur){
      var gs = worldToScreen(grabbed.x, grabbed.y);
      var ge = worldToScreen(grabbed.x + (grabCur.x - grabStart.x), grabbed.y + (grabCur.y - grabStart.y));
      ctx.beginPath();
      ctx.arc(gs.x, gs.y, Math.max(3, grabbed.r*camera.zoom) + 4, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      drawArrow(gs.x, gs.y, ge.x, ge.y);
    }

    if (dragging && startWorld && curWorld){
      var s0 = worldToScreen(startWorld.x, startWorld.y);
      var mass = presets[currentPreset].mass;
      var r = massToRadius(mass) * (presets[currentPreset].sizeMultiplier || 1) * camera.zoom;

      ctx.beginPath();
      ctx.arc(s0.x, s0.y, Math.max(1.5,r), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (orbitMode && anchorBody){
        var sa = worldToScreen(anchorBody.x, anchorBody.y);
        var dxr = startWorld.x - anchorBody.x, dyr = startWorld.y - anchorBody.y;
        var dist = Math.sqrt(dxr*dxr + dyr*dyr) || 1;
        ctx.beginPath();
        ctx.arc(sa.x, sa.y, dist*camera.zoom, 0, Math.PI*2);
        ctx.setLineDash([5,6]);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.stroke();
        ctx.setLineDash([]);

        var pv = presets[currentPreset];
        if (!pv.star && anchorBody.mass >= 2*pv.mass){
          var rl = rocheLimit(anchorBody, { mass: pv.mass }) * camera.zoom;
          ctx.beginPath();
          ctx.arc(sa.x, sa.y, rl, 0, Math.PI*2);
          ctx.setLineDash([3,5]);
          ctx.strokeStyle = dist*camera.zoom < rl ? 'rgba(255,90,90,0.9)' : 'rgba(255,90,90,0.4)';
          ctx.stroke();
          ctx.setLineDash([]);
        }

        var speed = Math.sqrt(G * anchorBody.mass / dist);
        var dragx = curWorld.x - startWorld.x, dragy = curWorld.y - startWorld.y;
        var cross = dxr*dragy - dyr*dragx;
        var dir = cross >= 0 ? 1 : -1;
        var tx = -dyr/dist, ty = dxr/dist;
        var arrowLen = Math.min(120, speed * 0.6) * camera.zoom;
        var ex = s0.x + tx*dir*arrowLen, ey = s0.y + ty*dir*arrowLen;
        drawArrow(s0.x, s0.y, ex, ey);
      } else {
        var s1 = worldToScreen(curWorld.x, curWorld.y);
        drawArrow(s0.x, s0.y, s1.x, s1.y);
      }
    }

    for (var pi=0; pi<particles.length; pi++){
      var p = particles[pi];
      var sp = worldToScreen(p.x, p.y);
      var t = p.life / p.maxLife;
      if (p.ring){
        var radius = (1-t) * p.maxRadius * camera.zoom;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, Math.max(0,radius), 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(' + p.rgb.join(',') + ',' + (t*0.8) + ')';
        ctx.lineWidth = 3;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, Math.max(0.5, p.size*camera.zoom*t), 0, Math.PI*2);
        ctx.fillStyle = 'rgba(' + p.rgb.join(',') + ',' + t + ')';
        ctx.fill();
      }
    }

    drawGas();
    drawFragments();
    drawSpaghetti();
    drawRocks();
    drawSupernovae();
    ctx.restore();

    if (screenFlash > 0.01){
      ctx.fillStyle = 'rgba(255,250,235,' + (screenFlash*screenFlash*0.85) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawArrow(x0,y0,x1,y1){
    ctx.strokeStyle = '#e8e8ea';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
    ctx.stroke();
    var angle = Math.atan2(y1-y0, x1-x0);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1 - 9*Math.cos(angle-0.4), y1 - 9*Math.sin(angle-0.4));
    ctx.lineTo(x1 - 9*Math.cos(angle+0.4), y1 - 9*Math.sin(angle+0.4));
    ctx.closePath();
    ctx.fillStyle = '#e8e8ea';
    ctx.fill();
  }

  var last = performance.now();
  function loop(now){
    var dt = Math.min((now-last)/1000, 0.05);
    last = now;
    var simElapsed = 0;
    if (playing){
      var total = dt * timeScale;
      var substeps = Math.max(1, Math.ceil(total / (1/120)));
      var subDt = total / substeps;
      var budgetEnd = performance.now() + 24;
      for (var s=0; s<substeps; s++){
        step(subDt);
        simElapsed += subDt;
        if (performance.now() > budgetEnd) break;
      }
    }
    updateParticles(dt);
    updateSupernovae(dt);
    updateSunspots(simElapsed);
    updateSpaghetti(simElapsed);
    draw();
    updateInfoPanel();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
