<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity sandbox</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b0d12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #cv { display:block; width:100vw; height:100vh; touch-action:none; }

  #toolbar {
    position:fixed; top:12px; left:12px; right:12px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    background:rgba(20,22,28,0.85); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    padding:8px 12px; z-index:10; color:#e8e8ea; font-size:13px;
  }
  .seg { display:flex; border:1px solid rgba(255,255,255,0.15); border-radius:8px; overflow:hidden; }
  .seg button {
    background:transparent; border:none; color:#c8c8cc; padding:6px 12px; font-size:13px;
    cursor:pointer;
  }
  .seg button.active { background:#4a4ae0; color:#fff; }
  .toolbtn {
    background:transparent; border:1px solid rgba(255,255,255,0.15); border-radius:8px;
    color:#e8e8ea; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .toolbtn:hover { background:rgba(255,255,255,0.08); }
  .toolbtn.active { background:#2a8f6f; border-color:#2a8f6f; color:#fff; }
  label.field { display:flex; align-items:center; gap:6px; color:#a8a8ae; }
  input[type=range] { width:110px; }
  #massOut { color:#e8e8ea; min-width:22px; display:inline-block; }
  #zoomOut { margin-left:auto; color:#77797f; }

  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(20,22,28,0.85); color:#c8c8cc; font-size:12.5px;
    padding:8px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.08);
    z-index:10; pointer-events:none; text-align:center; max-width:90vw;
  }
</style>
</head>
<body>

<div id="toolbar">
  <div class="seg">
    <button id="modeSpawn" class="active">Spawn</button>
    <button id="modePan">Pan</button>
    <button id="modeDrag">Drag</button>
  </div>
  <button id="orbitToggle" class="toolbtn">Orbit mode</button>
  <div class="seg">
    <button id="presetMoon" data-mass="5">Moon</button>
    <button id="presetPlanet" data-mass="15" class="active">Planet</button>
    <button id="presetGasGiant" data-mass="120">Gas giant</button>
    <button id="presetStar" data-mass="1500">Star</button>
    <button id="presetRedGiant" data-mass="2500">Red giant</button>
    <button id="presetSupergiant" data-mass="5000">Supergiant</button>
    <button id="presetNeutronStar" data-mass="1300">Neutron star</button>
    <button id="presetBlackHole" data-mass="20000">Black hole</button>
    <button id="presetOrangeDwarf" data-mass="900">Orange dwarf</button>
    <button id="presetRedDwarf" data-mass="300">Red dwarf</button>
  </div>
  <button id="playBtn" class="toolbtn">Pause</button>
  <label class="field">Speed
    <input type="range" id="speedRange" min="0" max="1" step="0.001" value="0" style="width:min(600px, 55vw);">
    <span id="speedOut">100%</span>
  </label>
  <button id="clearBtn" class="toolbtn">Clear</button>
  <button id="fsBtn" class="toolbtn" title="Toggle fullscreen (F)">⛶ Fullscreen</button>
  <span id="zoomOut">100%</span>
</div>

<canvas id="cv"></canvas>
<div id="panel" style="display:none; position:fixed; top:72px; right:12px; bottom:12px; width:320px; background:rgba(20,22,28,0.92); backdrop-filter:blur(6px); color:#e8e8ea; font-size:14px; padding:16px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); z-index:10; box-sizing:border-box; display:none; flex-direction:column; gap:14px;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span id="panelTitle" style="font-size:18px; font-weight:600;"></span>
    <button id="panelClose" class="toolbtn" style="padding:4px 10px;">✕</button>
  </div>
  <canvas id="portrait" width="288" height="288" style="width:100%; aspect-ratio:1; border-radius:10px; background:#05060a; border:1px solid rgba(255,255,255,0.06);"></canvas>
  <div id="info" style="line-height:1.7;"></div>
</div>
<div id="hint">Click-drag to spawn a body and fling it. Orbit-mode targets get a dashed ring so you can spot them — they're still fully affected by gravity. Scroll to zoom.</div>

<script>
(function(){
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  var G = 4000;
  var camera = { x: 0, y: 0, zoom: 1 };
  var bodies = [];
  var playing = true;
  var mode = 'spawn';
  var orbitMode = false;

  var presets = {
    moon:   { mass: 5,   color: '#B4B2A9' },
    planet: { mass: 15,  color: '#378ADD' },
    gasGiant: { mass: 120, color: '#C9A27A', sizeMultiplier: 7.4 }, // preview size only — real size is rolled per spawn
    star:   { mass: 1500, color: '#EF9F27', sizeMultiplier: 20, star: true },
    redGiant: { mass: 2500, color: '#D2491F', sizeMultiplier: 171.8, star: true, unstable: true },
    supergiant: { mass: 5000, color: '#B8341A', sizeMultiplier: 696.08, star: true, unstable: true },
    neutronStar: { mass: 1300, color: '#D9ECFF', sizeMultiplier: 0.28839, star: true, noSpots: true, bright: true },
    blackHole: { mass: 20000, color: '#0A0A12', sizeMultiplier: 3.8298, star: true, noSpots: true, notStar: true },
    orangeDwarf: { mass: 900, color: '#E0672A', sizeMultiplier: 15.48, star: true },
    redDwarf: { mass: 300, color: '#C41E1E', sizeMultiplier: 15.75, star: true }
  };
  var currentPreset = 'planet';

  var zoomOut = document.getElementById('zoomOut');

  var particles = [];
  var shake = 0;
  var shakeOffX = 0, shakeOffY = 0; // the actual shake offset used this frame, so clicks can correct for it

  function hexToRgb(hex){
    var v = parseInt(hex.slice(1),16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }

  function spawnExplosion(x, y, totalMass, colors, maxCount){
    var count = Math.min(maxCount || 90, 18 + totalMass * 1.6);
    var rgbs = colors.map(hexToRgb);
    for (var i=0;i<count;i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = (40 + Math.random()*260) * (0.6 + totalMass/40);
      var rgb = rgbs[Math.floor(Math.random()*rgbs.length)];
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        life: 0.5 + Math.random()*0.7,
        maxLife: 0.5 + Math.random()*0.7,
        size: 1.5 + Math.random()*3.5,
        rgb: rgb
      });
    }
    particles.push({
      x: x, y: y, vx:0, vy:0,
      life: 0.4, maxLife: 0.4, size: 0,
      rgb: [255,235,180], ring:true, maxRadius: 30 + totalMass*2.2
    });
    shake = Math.min(24, shake + 6 + totalMass*0.3);
  }

  function massToRadius(m){ return 6 + Math.cbrt(m) * 4; }

  // ---- supernova / nebula / gas ----
  var supernovae = [];   // short real-time flash effects
  var nebulae = [];      // long-lived clouds, aged in sim time
  var gas = [];          // self-gravitating gas particles, aged in sim time
  var screenFlash = 0;
  var NEBULA_LIFE = 1200; // 20 sim-minutes
  var SUPERNOVA_SPEED = 160; // relative speed needed for a star death to go supernova
  var nebulaHues = [285, 320, 200, 25, 190, 340, 260];

  function circularMeanHue(hues){
    var sx = 0, sy = 0;
    hues.forEach(function(h){ var r = h*Math.PI/180; sx += Math.cos(r); sy += Math.sin(r); });
    return (Math.atan2(sy, sx) * 180/Math.PI + 360) % 360;
  }

  function capArray(arr, max){
    if (arr.length > max) arr.splice(0, arr.length - max);
  }

  function spawnSupernova(x, y, vx, vy, r, remnant){
    supernovae.push({ x:x, y:y, vx:vx, vy:vy, r:r, age:0, maxAge:3.2, spin: Math.random()*Math.PI*2 });

    var blobs = [];
    for (var i=0;i<16;i++){
      blobs.push({
        a: Math.random()*Math.PI*2,
        d: Math.pow(Math.random(), 0.7)*0.8,
        r: 0.22 + Math.random()*0.42,
        hue: nebulaHues[Math.floor(Math.random()*nebulaHues.length)],
        alpha: 0.28 + Math.random()*0.42,
        spin: (Math.random()-0.5)*2,
        stretch: 0.6 + Math.random()*0.8,
        tilt: Math.random()*Math.PI
      });
    }
    nebulae.push({ x:x, y:y, vx:vx, vy:vy, baseR:r, age:0, maxAge:NEBULA_LIFE, rot:0, blobs:blobs, dwarfsSpawned:0,
      glowHue: circularMeanHue(blobs.map(function(bl){ return bl.hue; })) });
    var nebulaRef = nebulae[nebulae.length - 1];

    var gasR = Math.max(10, Math.min(120, r*0.012));
    var gasMass = remnant === 'neutronStar' ? 100 : (remnant === 'blackHole' ? 250 : 10);
    for (var g=0; g<250; g++){
      var ang = Math.random()*Math.PI*2;
      var d = Math.sqrt(Math.random()) * r * 12;
      var speed = 20 + Math.random()*70;
      var tang = (Math.random()-0.5)*40;
      gas.push({
        x: x + Math.cos(ang)*d, y: y + Math.sin(ang)*d,
        vx: Math.cos(ang)*speed - Math.sin(ang)*tang,
        vy: Math.sin(ang)*speed + Math.cos(ang)*tang,
        mass: gasMass, r: gasR,
        hue: nebulaHues[Math.floor(Math.random()*nebulaHues.length)],
        age: 0, maxAge: NEBULA_LIFE, nebula: nebulaRef
      });
    }
    capArray(gas, 900);

    spawnExplosion(x, y, 90, ['#FFF3C4', '#EF9F27', '#D85A30']);
    shake = 48;
    screenFlash = 1;

    if (remnant === 'neutronStar') spawnNeutronStar(x, y, vx, vy);
    else if (remnant === 'blackHole') spawnBlackHoleRemnant(x, y, vx, vy);
  }

  function spawnNeutronStar(x, y, vx, vy){
    var p = presets.neutronStar;
    bodies.push({
      x:x, y:y, vx:vx, vy:vy,
      mass: p.mass, r: massToRadius(p.mass) * p.sizeMultiplier,
      color: p.color, sizeMultiplier: p.sizeMultiplier,
      type: 'neutronStar', spots: [], noSpots: true, bright: true, fixed: false
    });
  }

  function spawnBlackHoleRemnant(x, y, vx, vy){
    var p = presets.blackHole;
    bodies.push({
      x:x, y:y, vx:vx, vy:vy,
      mass: p.mass, r: massToRadius(p.mass) * p.sizeMultiplier,
      color: p.color, sizeMultiplier: p.sizeMultiplier,
      type: 'blackHole', fixed: false
    });
  }

  function stepGasAndNebulae(dt){
    var n = gas.length;
    if (n){
      var GAS_G = G * 5;
      var BODY_PULL_G = G * 40; // bodies pull gas around far more strongly than gas pulls itself
      var ax = new Array(n).fill(0), ay = new Array(n).fill(0);

      // gas-on-gas gravity only matters between nearby particles (it's much weaker than
      // body pull, and falls off with distance squared), so bucket into a grid and only
      // check same/neighboring cells — this keeps a large post-supernova gas count from
      // turning into an O(n^2) cost that starves the substep budget every frame
      var cellSize = 3000;
      var CELL_KEY_MULT = 10000000; // wide enough margin that cy can never collide across different cx
      var grid = {};
      for (var gi=0; gi<n; gi++){
        var key = Math.floor(gas[gi].x/cellSize) * CELL_KEY_MULT + Math.floor(gas[gi].y/cellSize);
        (grid[key] || (grid[key] = [])).push(gi);
      }

      for (var i=0;i<n;i++){
        var cx = Math.floor(gas[i].x/cellSize), cy = Math.floor(gas[i].y/cellSize);
        for (var ncx=cx-1; ncx<=cx+1; ncx++){
          for (var ncy=cy-1; ncy<=cy+1; ncy++){
            var neighbors = grid[ncx * CELL_KEY_MULT + ncy];
            if (!neighbors) continue;
            for (var ni=0; ni<neighbors.length; ni++){
              var j = neighbors[ni];
              if (j <= i) continue; // each pair handled once, and skips self
              var dx = gas[j].x - gas[i].x, dy = gas[j].y - gas[i].y;
              var soft = (gas[i].r + gas[j].r) * 0.8;
              var d2 = dx*dx + dy*dy + soft*soft;
              var d = Math.sqrt(d2);
              var f = GAS_G / d2;
              var fx = f*dx/d, fy = f*dy/d;
              ax[i] += fx*gas[j].mass; ay[i] += fy*gas[j].mass;
              ax[j] -= fx*gas[i].mass; ay[j] -= fy*gas[i].mass;
            }
          }
        }
        for (var s0=0; s0<bodies.length; s0++){
          var bd = bodies[s0];
          if (bd === gas[i].sourceStar) continue; // once stripped, it no longer answers to its old star's pull
          var bx = bd.x - gas[i].x, by = bd.y - gas[i].y;
          var bd2 = bx*bx + by*by + bd.r*bd.r;
          var bf = BODY_PULL_G * bd.mass / bd2;
          var bdist = Math.sqrt(bd2);
          ax[i] += bf*bx/bdist; ay[i] += bf*by/bdist;
        }
      }
      for (var k=n-1;k>=0;k--){
        var p = gas[k];
        p.vx += ax[k]*dt; p.vy += ay[k]*dt;
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.age += dt;
        if (p.age >= p.maxAge){ gas.splice(k,1); continue; }

        for (var s=0;s<bodies.length;s++){
          var st = bodies[s];
          if (!st.spots && st.type !== 'blackHole') continue;
          if (st === p.sourceStar) continue;
          var ddx = p.x - st.x, ddy = p.y - st.y;
          if (ddx*ddx + ddy*ddy < st.r*st.r){
            st.mass += 25;
            growStellarBody(st);
            gas.splice(k,1);
            break;
          }
        }
      }
    }
    for (var m=nebulae.length-1;m>=0;m--){
      var nb = nebulae[m];
      nb.age += dt;
      nb.rot += dt*0.0006;
      if (nb.age >= nb.maxAge) nebulae.splice(m,1);
    }
    condenseTimer += dt;
    if (condenseTimer >= 2){
      condenseTimer = 0;
      condenseGas();
    }
  }

  function updateSupernovae(dt){
    for (var i=supernovae.length-1;i>=0;i--){
      var sn = supernovae[i];
      sn.age += dt;
      if (sn.age >= sn.maxAge) supernovae.splice(i,1);
    }
    screenFlash = Math.max(0, screenFlash - dt*1.4);
  }

  // ---- tidal streams ----
  var fragments = [];

  // velocity offset for a piece displaced by `along` (positive = toward the primary)
  // from the body's centre: inner material orbits faster (v ~ r^-1/2), outer slower
  function shearVelocity(b, primary, along){
    if (!primary) return { vx: 0, vy: 0 };
    var dx = primary.x - b.x, dy = primary.y - b.y;
    var d = Math.sqrt(dx*dx+dy*dy) || 1;
    var ux = dx/d, uy = dy/d;          // toward primary
    var tx = -uy, ty = ux;             // tangential
    var rvx = b.vx - primary.vx, rvy = b.vy - primary.vy;
    var vt = rvx*tx + rvy*ty;
    var dv = vt * along / (2*d);       // dv/dr = -v/(2r), and r decreases as along increases
    return { vx: tx*dv, vy: ty*dv };
  }

  function spawnTidalStream(b, primary){
    var count = b.mass >= 10 ? 28 : 14;
    var d = tidalShape(b, 1) || { ang:0, near:0, far:0, squeeze:1, shear:0 };
    var ca = Math.cos(d.ang), sa = Math.sin(d.ang);
    var rgb = hexToRgb(b.color);
    var lenNear = b.r * (1 + d.near), lenFar = b.r * (1 + d.far);
    for (var i=0;i<count;i++){
      var u = (i + Math.random()) / count;                 // 0..1 from far tip to near tip
      var along = -lenFar + u * (lenFar + lenNear);
      var off = (Math.random()-0.5) * b.r * d.squeeze * 0.8;
      var lx = along, ly = off + d.shear * along;
      var wx = b.x + lx*ca - ly*sa, wy = b.y + lx*sa + ly*ca;
      var sv = shearVelocity(b, primary, along);
      fragments.push({
        x: wx, y: wy,
        vx: b.vx + sv.vx + (Math.random()-0.5)*2,
        vy: b.vy + sv.vy + (Math.random()-0.5)*2,
        r: 1.5 + Math.random()*2.5,
        age: 0,
        host: null, hostTime: 0
      });
    }
    capArray(fragments, 250);
    shake = Math.min(24, shake + 5);
  }

  var FRAG_COOL_TIME = 180;   // sim seconds from red-hot to grey
  var RING_TIME = 300;        // sim seconds in a bound orbit before becoming ring material

  function stepFragments(dt){
    for (var i=fragments.length-1;i>=0;i--){
      var f = fragments[i];
      var ax = 0, ay = 0, dead = false;
      var dom = null, domPull = -1, domD = 0;
      for (var j=0;j<bodies.length;j++){
        var q = bodies[j];
        var dx = q.x - f.x, dy = q.y - f.y;
        var d2 = dx*dx + dy*dy;
        if (d2 < q.r*q.r){
          q.mass += 1;
          if (q.spots) growStellarBody(q);
          else q.r = massToRadius(q.mass) * (q.sizeMultiplier || 1);
          dead = true; break;
        }
        var d = Math.sqrt(d2);
        var a = G * q.mass / d2;
        ax += a*dx/d; ay += a*dy/d;
        if (a > domPull){ domPull = a; dom = q; domD = d; }
      }
      if (dead){ fragments.splice(i,1); continue; }
      f.age += dt;
      f.vx += ax*dt; f.vy += ay*dt;
      f.x += f.vx*dt; f.y += f.vy*dt;

      // is it in a bound orbit around its dominant attractor?
      if (dom){
        var rvx = f.vx - dom.vx, rvy = f.vy - dom.vy;
        var bound = 0.5*(rvx*rvx + rvy*rvy) - G*dom.mass/domD < 0;
        if (bound && dom === f.host){
          f.hostTime += dt;
          // orbital decay: drag inward at 2.5% of the host's radius per second
          var hx = f.host.x - f.x, hy = f.host.y - f.y;
          var hd = Math.sqrt(hx*hx + hy*hy) || 1;
          var pull = Math.min(hd - f.host.r*0.5, 0.025 * f.host.r * dt);
          if (pull > 0){
            f.x += hx/hd * pull; f.y += hy/hd * pull;
            // keep the orbit roughly circular as it shrinks (v ~ 1/sqrt(r))
            var scale = Math.sqrt(hd / (hd - pull));
            var rvx2 = f.vx - f.host.vx, rvy2 = f.vy - f.host.vy;
            f.vx = f.host.vx + rvx2*scale; f.vy = f.host.vy + rvy2*scale;
          }
        } else {
          f.host = bound ? dom : null;
          f.hostTime = 0;
        }
        if (f.host && f.hostTime >= RING_TIME){
          addToRings(f.host, domD / f.host.r);
          fragments.splice(i,1);
          continue;
        }
      }
    }
  }

  function addToRings(host, radiusInHostRadii){
    radiusInHostRadii = Math.min(radiusInHostRadii, 12); // keep rings within a sane multiple of the host
    if (!host.rings){
      host.rings = { count: 0, rMin: radiusInHostRadii, rMax: radiusInHostRadii, sum: 0 };
    }
    var rg = host.rings;
    rg.count++;
    rg.sum += radiusInHostRadii;
    rg.rMin = Math.min(rg.rMin, radiusInHostRadii);
    rg.rMax = Math.max(rg.rMax, radiusInHostRadii);
  }

  function fragmentColor(f){
    var heat = Math.max(0, 1 - f.age / FRAG_COOL_TIME);
    var h = heat*heat;
    var r = Math.round(130 + (255-130)*h), g = Math.round(125 + (80-125)*h), b = Math.round(118 + (30-118)*h);
    return { rgb: [r,g,b], heat: heat };
  }

  function drawFragments(){
    if (!fragments.length) return;
    for (var i=0;i<fragments.length;i++){
      var f = fragments[i];
      var sp = worldToScreen(f.x, f.y);
      var pr = Math.max(1, f.r * camera.zoom);
      if (sp.x < -pr*4 || sp.x > W+pr*4 || sp.y < -pr*4 || sp.y > H+pr*4) continue;
      var c = fragmentColor(f);
      if (c.heat > 0.02){
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var gR = pr * (2 + 2.5*c.heat);
        var g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, gR);
        g.addColorStop(0, 'rgba(255,120,40,' + (0.6*c.heat) + ')');
        g.addColorStop(1, 'rgba(255,60,20,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, gR, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = 'rgb(' + c.rgb.join(',') + ')';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, pr, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawRings(b, s, trueR){
    var rg = b.rings;
    if (!rg || rg.count <= 0) return;
    if (trueR < 0.05) return; // body has shrunk below visibility — ring should too, not hang around at a fixed size
    var inner = Math.max(1.05, rg.rMin - 0.15) * trueR;
    var outer = Math.max(inner + Math.max(2, trueR*0.25), (rg.rMax + 0.15) * trueR);
    if (outer < 2) return;
    // more material -> brighter; bigger host -> the same material is spread thinner
    var sizeRef = massToRadius(15);
    var alpha = Math.min(0.85, rg.count * 0.045 * (sizeRef / b.r));
    if (alpha < 0.01) return;
    var g = ctx.createRadialGradient(s.x, s.y, inner, s.x, s.y, outer);
    var mid = (rg.sum / rg.count) * trueR;
    var midT = Math.max(0.05, Math.min(0.95, (mid - inner) / (outer - inner)));
    g.addColorStop(0, 'rgba(170,160,150,0)');
    g.addColorStop(Math.max(0.01, midT - 0.25), 'rgba(185,175,165,' + (alpha*0.55) + ')');
    g.addColorStop(midT, 'rgba(205,195,185,' + alpha + ')');
    g.addColorStop(Math.min(0.99, midT + 0.2), 'rgba(185,175,165,' + (alpha*0.5) + ')');
    g.addColorStop(1, 'rgba(170,160,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, outer, 0, Math.PI*2);
    ctx.arc(s.x, s.y, inner, 0, Math.PI*2, true);
    ctx.fill();
    // a few faint gaps for texture
    ctx.strokeStyle = 'rgba(0,0,0,' + (alpha*0.35) + ')';
    ctx.lineWidth = Math.max(0.6, trueR*0.02);
    for (var k=1;k<=3;k++){
      var gr = inner + (outer-inner) * (0.22*k + 0.1);
      ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, Math.PI*2); ctx.stroke();
    }
  }

  // ---- rock debris ----
  var rocks = [];

  function spawnRocks(b, primary){
    var count = b.mass >= 10 ? 10 : 5;
    for (var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var d = Math.random()*b.r;
      var speed = 15;
      var verts = [];
      var nv = 5 + Math.floor(Math.random()*3);
      for (var v=0; v<nv; v++) verts.push(0.6 + Math.random()*0.5);
      var sv = primary ? shearVelocity(b, primary, Math.cos(ang)*d) : { vx:0, vy:0 };
      rocks.push({
        x: b.x + Math.cos(ang)*d, y: b.y + Math.sin(ang)*d,
        vx: b.vx + Math.cos(ang)*speed + sv.vx, vy: b.vy + Math.sin(ang)*speed + sv.vy,
        mass: 1, r: 3 + Math.random()*2.5,
        rot: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*3,
        verts: verts
      });
    }
    capArray(rocks, 300);
  }

  function stepRocks(dt){
    var n = rocks.length;
    if (!n) return;
    var ROCK_G = G * 5;
    var ax = new Array(n).fill(0), ay = new Array(n).fill(0);
    for (var i=0;i<n;i++){
      for (var j=i+1;j<n;j++){
        var dx = rocks[j].x - rocks[i].x, dy = rocks[j].y - rocks[i].y;
        var soft = (rocks[i].r + rocks[j].r) * 2;
        var d2 = dx*dx + dy*dy + soft*soft;
        var d = Math.sqrt(d2);
        var f = ROCK_G / d2;
        var fx = f*dx/d, fy = f*dy/d;
        ax[i] += fx*rocks[j].mass; ay[i] += fy*rocks[j].mass;
        ax[j] -= fx*rocks[i].mass; ay[j] -= fy*rocks[i].mass;
      }
    }
    for (var k=n-1;k>=0;k--){
      var p = rocks[k];
      p.vx += ax[k]*dt; p.vy += ay[k]*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.spin*dt;
      for (var s=0;s<bodies.length;s++){
        var st = bodies[s];
        if (!st.spots && st.type !== 'blackHole') continue;
        var ddx = p.x - st.x, ddy = p.y - st.y;
        if (ddx*ddx + ddy*ddy < st.r*st.r){
          rocks.splice(k,1);
          break;
        }
      }
    }
  }

  function drawRocks(){
    for (var i=0;i<rocks.length;i++){
      var p = rocks[i];
      var sp = worldToScreen(p.x, p.y);
      var pr = p.r * camera.zoom;
      if (sp.x < -pr || sp.x > W+pr || sp.y < -pr || sp.y > H+pr) continue;
      if (pr < 1.2){
        ctx.fillStyle = 'rgba(150,140,125,0.8)';
        ctx.fillRect(sp.x, sp.y, 1.5, 1.5);
        continue;
      }
      ctx.beginPath();
      for (var v=0; v<p.verts.length; v++){
        var a = p.rot + (v / p.verts.length) * Math.PI*2;
        var rr2 = pr * p.verts[v];
        var vx = sp.x + Math.cos(a)*rr2, vy = sp.y + Math.sin(a)*rr2;
        if (v === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fillStyle = '#6E665C';
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,180,165,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // ---- stellar growth: red dwarf -> orange dwarf -> star ----
  function hexOf(rgb){
    return '#' + rgb.map(function(v){ return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0'); }).join('');
  }
  function lerpColorHex(c1, c2, t){
    var a = hexToRgb(c1), b = hexToRgb(c2);
    return hexOf([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
  }
  var STELLAR_STOPS = [
    { m: 300,  type:'redDwarf',    color: presets.redDwarf.color,    sm: presets.redDwarf.sizeMultiplier },
    { m: 900,  type:'orangeDwarf', color: presets.orangeDwarf.color, sm: presets.orangeDwarf.sizeMultiplier },
    { m: 1500, type:'star',        color: presets.star.color,        sm: presets.star.sizeMultiplier }
  ];

  function growStellarBody(b){
    if (!b.dwarfLineage){ b.r = massToRadius(b.mass) * (b.sizeMultiplier || 1); return; }
    var s0 = STELLAR_STOPS[0], s1 = STELLAR_STOPS[1], s2 = STELLAR_STOPS[2];
    var lo, hi;
    if (b.mass <= s0.m){ lo = s0; hi = s0; }
    else if (b.mass < s1.m){ lo = s0; hi = s1; }
    else if (b.mass < s2.m){ lo = s1; hi = s2; }
    else { lo = s2; hi = s2; }
    var t = (hi.m === lo.m) ? 0 : (b.mass - lo.m) / (hi.m - lo.m);
    b.color = lerpColorHex(lo.color, hi.color, t);
    b.sizeMultiplier = lo.sm + (hi.sm - lo.sm) * t;
    b.r = massToRadius(b.mass) * b.sizeMultiplier;
    b.type = (b.mass >= s1.m) ? (b.mass >= s2.m ? 'star' : 'orangeDwarf') : 'redDwarf';
    if (b.mass >= s2.m){
      b.color = s2.color; b.sizeMultiplier = s2.sm; b.r = massToRadius(b.mass) * s2.sm;
      b.dwarfLineage = false;
    }
  }


  var STAR_REF_R = massToRadius(presets.star.mass) * presets.star.sizeMultiplier;
  var CONDENSE_R = Math.sqrt(0.1) * 12 * STAR_REF_R;   // radius of a circle with 10% of a new nebula's area
  var CONDENSE_MIN = 11;                                // "more than 10"
  var CONDENSE_MIN_AGE = 30;                            // sim seconds before gas can collapse
  var condenseTimer = 0;

  function spawnRedDwarf(x, y, vx, vy){
    var p = presets.redDwarf;
    var body = {
      x:x, y:y, vx:vx, vy:vy,
      mass: p.mass, r: massToRadius(p.mass) * p.sizeMultiplier,
      color: p.color, sizeMultiplier: p.sizeMultiplier,
      type: 'redDwarf',
      dwarfLineage: true,
      fixed: false, spots: []
    };
    for (var si=0; si<5; si++) body.spots.push(makeSpot(Math.random()));
    bodies.push(body);
    spawnExplosion(x, y, 40, ['#FFD9C2', p.color]);
  }

  // true if a freshly-formed red dwarf at (px,py) would immediately be caught by
  // something's disruption reach and destroyed on the very next substep
  function positionUnsafeForNewStar(px, py){
    var p = presets.redDwarf;
    var testR = massToRadius(p.mass) * p.sizeMultiplier;
    for (var i=0;i<bodies.length;i++){
      var q = bodies[i];
      var isRipper = q.type === 'blackHole' || ((q.type === 'redGiant' || q.type === 'neutronStar') && RED_GIANT_RIP_MASS.redDwarf);
      if (!isRipper) continue;
      var reachDist = (q.type === 'blackHole' || q.type === 'neutronStar')
        ? Math.max(rocheLimit(q, {mass: p.mass}), (q.r + testR) * 1.15)
        : rocheLimit(q, {mass: p.mass});
      if (Math.hypot(px - q.x, py - q.y) < reachDist) return true;
    }
    return false;
  }

  function condenseGas(){
    var r2 = CONDENSE_R * CONDENSE_R;
    for (var guard=0; guard<12; guard++){
      var n = gas.length;
      if (n < CONDENSE_MIN) return;
      var bestIdx = -1, bestCount = 0;
      for (var i=0;i<n;i++){
        if (gas[i].age < CONDENSE_MIN_AGE) continue;
        var c = 0;
        for (var j=0;j<n;j++){
          var dx = gas[j].x - gas[i].x, dy = gas[j].y - gas[i].y;
          if (dx*dx + dy*dy <= r2) c++;
        }
        if (c > bestCount){ bestCount = c; bestIdx = i; }
      }
      if (bestCount < CONDENSE_MIN) return;

      var owner = gas[bestIdx].nebula;
      if (owner && nebulae.indexOf(owner) !== -1 && owner.dwarfsSpawned >= 5) return; // this nebula is done forming dwarfs

      var cx = gas[bestIdx].x, cy = gas[bestIdx].y;
      if (positionUnsafeForNewStar(cx, cy)) return; // too close to something that would instantly destroy it — let it keep flowing as gas instead

      var sx = 0, sy = 0, svx = 0, svy = 0, sm = 0;
      var remaining = [];
      for (var k=0;k<n;k++){
        var g = gas[k];
        var ddx = g.x - cx, ddy = g.y - cy;
        if (ddx*ddx + ddy*ddy <= r2){
          sx += g.x*g.mass; sy += g.y*g.mass; svx += g.vx*g.mass; svy += g.vy*g.mass; sm += g.mass;
        } else remaining.push(g);
      }
      gas = remaining;
      var px = sx/sm, py = sy/sm, ovx = 0, ovy = 0;
      var nearest = (owner && nebulae.indexOf(owner) !== -1) ? owner : null;
      var nd = Infinity;
      if (nearest){
        nd = Math.hypot(px - nearest.x, py - nearest.y);
      } else {
        for (var q=0;q<nebulae.length;q++){
          var dd = Math.hypot(px - nebulae[q].x, py - nebulae[q].y);
          if (dd < nd){ nd = dd; nearest = nebulae[q]; }
        }
      }
      if (nearest && nd > 1e-6){
        ovx = (px - nearest.x) / nd * 15;
        ovy = (py - nearest.y) / nd * 15;
      }
      if (nearest) nearest.dwarfsSpawned++;
      spawnRedDwarf(px, py, ovx, ovy);
    }
  }

  function screenToWorld(sx, sy){
    return { x: camera.x + (sx - shakeOffX - W/2)/camera.zoom, y: camera.y + (sy - shakeOffY - H/2)/camera.zoom };
  }
  function worldToScreen(wx, wy){
    return { x: (wx - camera.x)*camera.zoom + W/2, y: (wy - camera.y)*camera.zoom + H/2 };
  }

  // ---- drag / spawn state ----
  var dragging = false;
  var panDragging = false;
  var startWorld = null;
  var curWorld = null;
  var lastScreen = null;
  var anchorBody = null;
  var downScreen = null;

  function heaviestOther(pt){
    // body whose gravity dominates at this point (mass / distance²)
    var best = null, bestPull = -1;
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      var dx = pt.x - b.x, dy = pt.y - b.y;
      var d2 = Math.max(dx*dx + dy*dy, b.r*b.r);
      var pull = b.mass / d2;
      if (pull > bestPull){ bestPull = pull; best = b; }
    }
    return best;
  }

  function bodyAt(worldPt){
    var MIN_HIT_PX = 12; // minimum tap/click target size on screen, regardless of true body size
    var best = null, bestDist = Infinity;
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      var dx = worldPt.x - b.x, dy = worldPt.y - b.y;
      var dist = Math.sqrt(dx*dx+dy*dy);
      var hitR = Math.max(b.r, MIN_HIT_PX / camera.zoom);
      if (dist <= hitR && dist < bestDist){ best = b; bestDist = dist; }
    }
    return best;
  }

  function pointerDown(sx, sy){
    if (mode === 'pan'){
      panDragging = true;
      lastScreen = {x:sx, y:sy};
      downScreen = {x:sx, y:sy};
      curScreen = {x:sx, y:sy};
      return;
    }
    if (mode === 'drag'){
      var w = screenToWorld(sx, sy);
      var hit = bodyAt(w);
      if (hit){
        grabbed = hit;
        grabStart = { x: w.x, y: w.y };
        grabCur = grabStart;
      }
      return;
    }
    dragging = true;
    downScreen = {x:sx, y:sy};
    startWorld = screenToWorld(sx, sy);
    curWorld = startWorld;
    anchorBody = orbitMode ? heaviestOther(startWorld) : null;
  }

  var curScreen = null;
  var grabbed = null;
  var grabStart = null;
  var grabCur = null;

  function pointerMove(sx, sy){
    curScreen = {x:sx, y:sy};
    if (grabbed){
      grabCur = screenToWorld(sx, sy);
      return;
    }
    if (panDragging){
      var dx = sx - lastScreen.x, dy = sy - lastScreen.y;
      camera.x -= dx / camera.zoom;
      camera.y -= dy / camera.zoom;
      lastScreen = {x:sx, y:sy};
      return;
    }
    if (dragging){
      curWorld = screenToWorld(sx, sy);
    }
  }

  // ---- procedural planet textures ----
  var TEX_SIZE = 256, TEX_VARIANTS = 3;
  var planetTextureCache = {};

  function toAlphaHex(n){
    return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  }

  function newTexCanvas(){
    var c = document.createElement('canvas');
    c.width = TEX_SIZE; c.height = TEX_SIZE;

  }

  function texRocky(variant){
    var c = newTexCanvas(), tctx = c.getContext('2d');
    var mid = TEX_SIZE/2;
    var palettes = [
      ['#8C7A64','#6E5D4A','#A6957E'],
      ['#7C7268','#5B534B','#948A7E'],
      ['#93705A','#6B4E3D','#B08D74']
    ];
    var pal = palettes[variant % palettes.length];
    tctx.fillStyle = pal[0];
    tctx.beginPath(); tctx.arc(mid, mid, mid, 0, Math.PI*2); tctx.fill();
    for (var i=0;i<55;i++){
      var a = Math.random()*Math.PI*2, d = Math.random()*mid*0.96;
      var x = mid+Math.cos(a)*d, y = mid+Math.sin(a)*d, r = (6+Math.random()*22) * (TEX_SIZE/200);
      tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI*2);
      tctx.fillStyle = (Math.random()<0.5?pal[1]:pal[2]) + toAlphaHex(50+Math.random()*70);
      tctx.fill();
    }
    for (var i=0;i<16;i++){
      var a = Math.random()*Math.PI*2, d = Math.random()*mid*0.9;
      var x = mid+Math.cos(a)*d, y = mid+Math.sin(a)*d, r = (4+Math.random()*11) * (TEX_SIZE/200);
      tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI*2);
      tctx.fillStyle = 'rgba(0,0,0,0.28)'; tctx.fill();

      tctx.fillStyle = pal[0]; tctx.fill();
      tctx.beginPath(); tctx.arc(x+r*0.3, y+r*0.3, r*0.32, 0, Math.PI*2);

  function texVenus(variant){

  // ---- gas giant & moon textures ----
  // each giant and moon gets its own texture: a palette family is picked, then the whole thing is
  // nudged in hue/saturation/lightness so no two bodies look alike
  function shiftHex(hex, dh, ds, dl){
    var rgb = hexToRgb(hex), r = rgb[0]/255, g = rgb[1]/255, b = rgb[2]/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0;
    if (max !== min){
      var dd = max - min;
      s = l > 0.5 ? dd/(2-max-min) : dd/(max+min);
      h = max === r ? (g-b)/dd + (g < b ? 6 : 0) : (max === g ? (b-r)/dd + 2 : (r-g)/dd + 4);
      h *= 60;
    }
    h = (h + dh + 360) % 360; s = Math.max(0, Math.min(1, s + ds)); l = Math.max(0, Math.min(1, l + dl));
    var c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
    var rr = 0, gg = 0, bb = 0;
    if (h < 60){ rr = c; gg = x; } else if (h < 120){ rr = x; gg = c; } else if (h < 180){ gg = c; bb = x; }
    else if (h < 240){ gg = x; bb = c; } else if (h < 300){ rr = x; bb = c; } else { rr = c; bb = x; }
    return hexOf([Math.round((rr+m)*255), Math.round((gg+m)*255), Math.round((bb+m)*255)]);
  }

  function pickPalette(palettes, hueRange, satRange, lightRange){
    var p = palettes[Math.floor(Math.random()*palettes.length)];
    var dh = (Math.random()-0.5)*hueRange, ds = (Math.random()-0.5)*satRange, dl = (Math.random()-0.5)*lightRange;
    function shift(v){
      if (typeof v === 'number') return v; // raw rgb triples (plume/crack tints) stay as authored
      if (typeof v === 'string') return shiftHex(v, dh, ds, dl);
      if (Array.isArray(v)) return v.map(shift);
      var o = {}; for (var k in v) o[k] = shift(v[k]); return o;
    }
    return shift(p);
  }

  function randInt(a, b){ return a + Math.floor(Math.random()*(b - a + 1)); }

  // wavy horizontal cloud bands across the whole square (the body clip trims it to a disc)
  function paintBands(tctx, colors, count, wave, aMin, aMax){
    var sc = TEX_SIZE/200, step = TEX_SIZE/count;
    for (var i=0;i<count;i++){
      var y0 = i*step + (Math.random()-0.5)*step*0.4;
      var h = step * (0.5 + Math.random()*0.9);
      var ph = Math.random()*Math.PI*2, ph2 = Math.random()*Math.PI*2, f = 0.02 + Math.random()*0.04;
      tctx.beginPath();
      for (var x=0; x<=TEX_SIZE; x+=6*sc) tctx.lineTo(x, y0 + Math.sin(x*f + ph)*wave*sc);
      for (var x2=TEX_SIZE; x2>=0; x2-=6*sc) tctx.lineTo(x2, y0 + h + Math.sin(x2*f + ph2)*wave*sc);
      tctx.closePath();
      tctx.fillStyle = colors[Math.floor(Math.random()*colors.length)] + toAlphaHex(aMin + Math.random()*(aMax-aMin));
      tctx.fill();
    }
  }

  // short curling strokes along band edges for turbulence
  function paintSwirls(tctx, colors, count, alpha){
    var sc = TEX_SIZE/200;
    tctx.lineCap = 'round';
    for (var i=0;i<count;i++){
      var x = Math.random()*TEX_SIZE, y = Math.random()*TEX_SIZE;
      var len = (8 + Math.random()*22)*sc, curl = (Math.random()-0.5)*0.5;
      tctx.beginPath(); tctx.moveTo(x, y);
      var ang = (Math.random()-0.5)*0.3;
      for (var k=0;k<6;k++){ ang += curl; x += Math.cos(ang)*len/6; y += Math.sin(ang)*len/6; tctx.lineTo(x, y); }
      tctx.lineWidth = (1 + Math.random()*2.5)*sc;
      tctx.strokeStyle = colors[Math.floor(Math.random()*colors.length)] + toAlphaHex(alpha*(0.5+Math.random()*0.5));
      tctx.stroke();
    }
  }

  // an oval storm: concentric ellipses with a lighter or darker core
  function paintStorm(tctx, x, y, rx, ry, outer, inner){
    for (var k=0;k<5;k++){
      var t = k/4;
      tctx.beginPath(); tctx.ellipse(x, y, rx*(1-t*0.75), ry*(1-t*0.75), 0, 0, Math.PI*2);
      tctx.fillStyle = (k%2===0 ? outer : inner) + toAlphaHex(150 + t*90);
      tctx.fill();
    }
  }

  function texStormyGiant(){

      { base:'#CBBFC8', bands:['#9A8494','#EAE2E8','#76606E','#B8A4B2','#5A4654'], spot:'#7A3E5E', spotIn:'#A8648A' }
    ], 40, 0.25, 0.12);
    tctx.fillStyle = p.base; tctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

    }
    for (var i=0, n=randInt(2, 10); i<n; i++){

  // ---- moon textures ----
  function paintCraters(tctx, count, fill, rMin, rMax){
    var sc = TEX_SIZE/200;
    for (var i=0;i<count;i++){
      var x = Math.random()*TEX_SIZE, y = Math.random()*TEX_SIZE, r = (rMin + Math.random()*(rMax-rMin))*sc;
      tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI*2);
      tctx.fillStyle = 'rgba(0,0,0,0.3)'; tctx.fill();
      tctx.beginPath(); tctx.arc(x-r*0.2, y-r*0.2, r*0.7, 0, Math.PI*2);
      tctx.fillStyle = fill; tctx.fill();
      tctx.beginPath(); tctx.arc(x+r*0.3, y+r*0.3, r*0.3, 0, Math.PI*2);
      tctx.fillStyle = 'rgba(255,255,255,0.15)'; tctx.fill();
    }
  }

  function paintBlotches(tctx, colors, count, rMin, rMax, aMin, aMax){
    var sc = TEX_SIZE/200;
    for (var i=0;i<count;i++){
      var x = Math.random()*TEX_SIZE, y = Math.random()*TEX_SIZE, r = (rMin + Math.random()*(rMax-rMin))*sc;
      tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI*2);
      tctx.fillStyle = colors[Math.floor(Math.random()*colors.length)] + toAlphaHex(aMin + Math.random()*(aMax-aMin));
      tctx.fill();
    }
  }

  function texCratered(){
    var c = newTexCanvas(), tctx = c.getContext('2d');
    var p = pickPalette([
      { base:'#A9A7A2', dark:['#6E6C68','#7A7873'] },
      { base:'#B0A494', dark:['#766A5C','#84786A'] },
      { base:'#9CA2A6', dark:['#646A70','#727880'] }
    ], 30, 0.1, 0.15);
    tctx.fillStyle = p.base; tctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
    paintBlotches(tctx, p.dark, randInt(0, 14), 14, 42, 90, 180); // dark lava plains
    paintCraters(tctx, randInt(15, 50), p.base, 2, 4 + Math.random()*12);
    return c;
  }

  function texRubble(){
    var c = newTexCanvas(), tctx = c.getContext('2d'), sc = TEX_SIZE/200;
    var p = pickPalette([
      { base:'#6B6058', blot:['#4A423C','#857A6F'] },
      { base:'#5E5A56', blot:['#3E3A38','#7A7670'] },
      { base:'#74604E', blot:['#4E3E30','#8E7860'] }
    ], 30, 0.15, 0.12);
    tctx.fillStyle = p.base; tctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
    paintBlotches(tctx, p.blot, randInt(10, 30), 8, 25, 50, 110);
    // sometimes one huge impact crater that nearly shattered it
    if (Math.random() < 0.6){
      var x = (50 + Math.random()*100)*sc, y = (50 + Math.random()*100)*sc, r = (25 + Math.random()*20)*sc;
      tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI*2); tctx.fillStyle = 'rgba(0,0,0,0.35)'; tctx.fill();
      tctx.beginPath(); tctx.arc(x-r*0.15, y-r*0.15, r*0.8, 0, Math.PI*2); tctx.fillStyle = p.base; tctx.fill();
    }
    paintCraters(tctx, randInt(25, 60), p.base, 2, 8);
    tctx.strokeStyle = 'rgba(30,25,20,0.35)'; tctx.lineWidth = 1.5*sc;
    var gAng = (Math.random()-0.5)*60*sc;
    for (var i=0, n=randInt(0, 12); i<n; i++){
      var gy = Math.random()*TEX_SIZE;
      tctx.beginPath(); tctx.moveTo(0, gy); tctx.lineTo(TEX_SIZE, gy + gAng + (Math.random()-0.5)*10*sc); tctx.stroke();
    }
    return c;
  }

  function texVolcanic(){
    var c = newTexCanvas(), tctx = c.getContext('2d'), sc = TEX_SIZE/200;
    var p = pickPalette([
      { base:'#E6D25A', blot:['#D9A23A','#F2E99A','#C9C25A'], plume:[190,60,25] },

    paintBlotches(tctx, p.blot, randInt(15, 40), 8, 26, 70, 150);

    var plume = p.plume.join(',');
    for (var i=0, n=randInt(6, 22); i<n; i++){

      var g = tctx.createRadialGradient(x, y, r, x, y, r*reach);

  function texGroovedIce(){
    var c = newTexCanvas(), tctx = c.getContext('2d'), sc = TEX_SIZE/200;
    var p = pickPalette([
      { base:'#8A7F72', groove:'#CDC8BE', line:'#96918A' },
      { base:'#76808A', groove:'#C8D0D8', line:'#8A949E' },
      { base:'#8C7868', groove:'#D6C8BA', line:'#A08E80' }
    ], 30, 0.1, 0.12);
    tctx.fillStyle = p.base; tctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
    // bright grooved terrain cutting across the dark ancient crust
    for (var i=0, n=randInt(3, 10); i<n; i++){
      var x = Math.random()*TEX_SIZE, y = Math.random()*TEX_SIZE, ang = Math.random()*Math.PI;
      var w = (12 + Math.random()*28)*sc, l = (50 + Math.random()*90)*sc;
      tctx.save(); tctx.translate(x, y); tctx.rotate(ang);
      tctx.fillStyle = p.groove + '8C'; tctx.fillRect(-l/2, -w/2, l, w);
      tctx.strokeStyle = p.line + '99'; tctx.lineWidth = 1*sc;
      for (var k=-w/2+3*sc; k<w/2; k+=(3 + Math.random()*3)*sc){ tctx.beginPath(); tctx.moveTo(-l/2, k); tctx.lineTo(l/2, k); tctx.stroke(); }
      tctx.restore();
    }

    if (Math.random() < 0.6){
      tctx.fillStyle = 'rgba(235,240,245,0.45)'; // frosty poles

    return c;

      { base:'#E9E3D6', blot:['#C9A98A','#D8C4A8'], crack:[140,75,45] },

  var TEXTURE_GENERATORS = { rocky: texRocky, venus: texVenus, habitable: texHabitable, mars: texMars, icy: texIcy,

  function getPlanetTexture(zoneType, variant){
    var gen = TEXTURE_GENERATORS[zoneType];
    if (!gen) return null;
    var key = zoneType + ':' + variant;
    if (!planetTextureCache[key]) planetTextureCache[key] = gen(variant);
    return planetTextureCache[key];
  }

  ];

  function nearestStarDistance(pt){
    var best = Infinity;
    for (var i=0;i<bodies.length;i++){
      var b = bodies[i];
      if (!b.spots) continue;
      var dx = pt.x - b.x, dy = pt.y - b.y;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d < best) best = d;
    }
    return best;
  }

  function pickPlanetZone(d){
    if (!isFinite(d)) d = 40000; // no star on the map yet -> mid-range mix
    var ln = Math.log(Math.max(1, d));
    var weights = PLANET_ZONES.map(function(z){
      return z.weight * Math.exp(-Math.pow(ln - Math.log(z.center), 2) / (2*z.sigma*z.sigma));
    });
    var sum = weights.reduce(function(a,b){ return a+b; }, 0);
    if (sum < 1e-9){
      var best = 0, bd = Infinity;
      PLANET_ZONES.forEach(function(z,i){ var dd = Math.abs(ln - Math.log(z.center)); if (dd < bd){ bd = dd; best = i; } });
      return PLANET_ZONES[best];
    }
    var r = Math.random()*sum;
    for (var i=0;i<weights.length;i++){ r -= weights[i]; if (r <= 0) return PLANET_ZONES[i]; }
    return PLANET_ZONES[PLANET_ZONES.length-1];
  }

  var GAS_GIANT_KINDS = [
    { type:'stormyGiant', label:'Banded, stormy gas giant', color:'#C9A27A', ringChance: 0.15 },
    { type:'paleGiant',   label:'Pale, bleached gas giant', color:'#E2D6B6', ringChance: 0.7 },
    { type:'iceCalm',     label:'Calm ice giant',           color:'#9FD8E0', ringChance: 0.25 },
    { type:'iceStormy',   label:'Banded, stormy ice giant', color:'#3B6FD0', ringChance: 0.25 },
    { type:'hotGiant',    label:'Hot, fiery gas giant',     color:'#E8601C', ringChance: 0 }
  ];
  function gasGiantKind(type){ return GAS_GIANT_KINDS.filter(function(k){ return k.type === type; })[0]; }

  // rolls kind, mass and size: far out they freeze into ice giants (mostly under 100 mass, and
  // never big); heavy ones near a star can be hot and bloated; otherwise banded-stormy or pale at any size
  function rollGasGiant(d){
    if (!isFinite(d)) d = 40000;
    var lt = (Math.log(d) - Math.log(180000)) / (Math.log(280000) - Math.log(180000));
    lt = Math.max(0, Math.min(1, lt));
    var iceChance = lt*lt*(3 - 2*lt);
    var planetR = massToRadius(15);
    var kind, mass, sizeFactor;
    if (Math.random() < iceChance){
      kind = gasGiantKind(Math.random() < 0.5 ? 'iceCalm' : 'iceStormy');
      mass = Math.random() < 0.85 ? 50 + Math.random()*50 : 100 + Math.random()*40;
      sizeFactor = 5 + Math.random()*5;
    } else {
      mass = 50 + Math.random()*150;
      var hotChance = mass >= 150 ? (d < 35000 ? 0.75 : 0.3) : 0;
      if (Math.random() < hotChance){
        kind = gasGiantKind('hotGiant');
        sizeFactor = 12 + (mass - 150)/50 * 5 + Math.random()*3;
      } else {
        kind = gasGiantKind(Math.random() < 0.5 ? 'stormyGiant' : 'paleGiant');
        sizeFactor = 5 + Math.random()*15;
      }
    }
    var r = planetR * sizeFactor;
    return { kind: kind, mass: mass, r: r, sizeMultiplier: r / massToRadius(mass) };
  }

  var MOON_KINDS = [
    { type:'cratered',   label:'Cratered rock',         color:'#A9A7A2', weight: 1.0, minMass: 3, size: 1.0 },
    { type:'groovedIce', label:'Grooved ice',           color:'#8A7F72', weight: 0.9, minMass: 3, size: 1.1 },
    { type:'crackedIce', label:'Cracked ice',           color:'#E9E3D6', weight: 0.8, minMass: 3, size: 0.95 },
    { type:'volcanic',   label:'Volcanic',              color:'#E6D25A', weight: 0.8, minMass: 4, size: 0.95 },
    { type:'hazy',       label:'Thick hazy atmosphere', color:'#D89A3E', weight: 0.6, minMass: 7, size: 1.1 },
    { type:'rubble',     label:'Tiny rubble chunk',     color:'#6B6058', weight: 0, minMass: 0, size: 0.55 }
  ];

  // a moon is 3-12 mass, but always under half its host's mass so it never reads as a binary
  function rollMoon(host){
    var mass = 3 + Math.random()*9;
    if (host) mass = Math.min(mass, host.mass / 2.2);
    var kind;
    if (mass < 4.5){
      kind = MOON_KINDS[Math.random() < 0.7 ? 5 : 0];
    } else {
      var pool = MOON_KINDS.filter(function(k){ return k.weight > 0 && mass >= k.minMass; });
      var hostIsGiant = host && host.type === 'gasGiant';
      var weights = pool.map(function(k){ return k.weight * (hostIsGiant && k.type === 'volcanic' ? 2 : 1); });
      var sum = weights.reduce(function(a,b){ return a+b; }, 0), r = Math.random()*sum;
      kind = pool[pool.length-1];
      for (var i=0;i<pool.length;i++){ r -= weights[i]; if (r <= 0){ kind = pool[i]; break; } }
    }
    return { kind: kind, mass: mass, sizeMultiplier: kind.size * (0.9 + Math.random()*0.2) };
  }

  // a giant born with rings: seed the normal debris-ring system with enough pieces to show up.
  // drawRings thins rings out on bigger hosts, so the piece count scales with the giant's radius
  function seedRings(body, kind){
    var targetAlpha = kind.type === 'paleGiant' ? 0.45 + Math.random()*0.35 : 0.15 + Math.random()*0.15;
    var count = Math.round(targetAlpha / (0.045 * massToRadius(15) / body.r));
    var inner = 1.25 + Math.random()*0.25, outer = (kind.type === 'paleGiant' ? 2.0 : 1.6) + Math.random()*0.6;
    for (var i=0;i<count;i++) addToRings(body, inner + (outer - inner) * Math.random());
  }

  function pointerUp(){
    if (grabbed){
      if (grabStart && grabCur){
        grabbed.vx += (grabCur.x - grabStart.x) * 1.4;
        grabbed.vy += (grabCur.y - grabStart.y) * 1.4;
      }
      grabbed = null; grabStart = null; grabCur = null;
      return;
    }
    if (panDragging){
      panDragging = false;
      var pmoved = (downScreen && curScreen) ? Math.hypot(curScreen.x - downScreen.x, curScreen.y - downScreen.y) : 0;
      if (pmoved < 6 && downScreen){
        var pw = screenToWorld(downScreen.x, downScreen.y);
        selected = bodyAt(pw);
      }
      return;
    }
    if (!dragging) return;
    dragging = false;

    var moved = downScreen && curScreen
      ? Math.hypot(curScreen.x - downScreen.x, curScreen.y - downScreen.y)
      : 999;

    if (moved < 6){
      var hit = bodyAt(startWorld);
      if (hit){
        hit.fixed = !hit.fixed;
        startWorld = null; curWorld = null; anchorBody = null;
        return;
      }
    }

    var preset = presets[currentPreset];
    var sizeMultiplier = preset.sizeMultiplier || 1;
    var mass = preset.mass, color = preset.color, planetZone = null;
    if (currentPreset === 'planet'){
      mass = 10 + Math.random()*10;
      planetZone = pickPlanetZone(nearestStarDistance(startWorld));
      color = planetZone.color;
    }
    if (currentPreset === 'moon'){
      var moon = rollMoon((orbitMode && anchorBody) ? anchorBody : heaviestOther(startWorld));
      mass = moon.mass; sizeMultiplier = moon.sizeMultiplier;
      planetZone = moon.kind; color = moon.kind.color;
    }
    var giant = null;
    if (currentPreset === 'gasGiant'){
      giant = rollGasGiant(nearestStarDistance(startWorld));
      mass = giant.mass; sizeMultiplier = giant.sizeMultiplier;
      planetZone = giant.kind; color = giant.kind.color;
    }
    var body = {
      x: startWorld.x, y: startWorld.y,
      vx: 0, vy: 0,
      mass: mass, r: massToRadius(mass) * sizeMultiplier,
      color: color,
      sizeMultiplier: sizeMultiplier,
      type: currentPreset,
      dwarfLineage: (currentPreset === 'redDwarf' || currentPreset === 'orangeDwarf'),
      bright: !!preset.bright,
      fixed: false
    };
    if (planetZone){
      body.planetZone = planetZone.type;
      // giants and moons each get a one-off texture; rocky planets share a few cached variants
      body.texVariant = (giant || moon) ? Math.floor(Math.random()*1e9) : Math.floor(Math.random()*TEX_VARIANTS);
      body.texAngle = Math.random()*Math.PI*2;
    }
    if (giant){
      body.hot = giant.kind.type === 'hotGiant';
      if (Math.random() < giant.kind.ringChance) seedRings(body, giant.kind);
    }
    if (preset.star && !preset.notStar){
      body.spots = [];
      body.noSpots = !!preset.noSpots;
      if (!preset.noSpots){
        for (var si=0; si<6; si++) body.spots.push(makeSpot(Math.random()));
      }
    }
    if (preset.unstable){
      body.wobble = [];
      for (var wi=0; wi<8; wi++){
        body.wobble.push({
          freq: 6 + wi*2 + Math.floor(Math.random()*3),
          amp: 0.006 + Math.random()*0.012,
          phase: Math.random()*Math.PI*2,
          speed: 0.25 + Math.random()*0.6
        });
      }
      body.wobbleT = 0;
    }

    if (orbitMode && anchorBody){
      var dxr = startWorld.x - anchorBody.x, dyr = startWorld.y - anchorBody.y;
      var dist = Math.sqrt(dxr*dxr + dyr*dyr) || 1;
      var speed = Math.sqrt(G * anchorBody.mass / dist);
      var dragx = curWorld.x - startWorld.x, dragy = curWorld.y - startWorld.y;
      var cross = dxr*dragy - dyr*dragx;
      var dir = cross >= 0 ? 1 : -1;
      var tx = -dyr/dist, ty = dxr/dist;
      body.vx = tx * speed * dir + anchorBody.vx;
      body.vy = ty * speed * dir + anchorBody.vy;
      body.parent = anchorBody;
      anchorBody.fixed = true;
    } else {
      body.vx = (curWorld.x - startWorld.x) * 1.4;
      body.vy = (curWorld.y - startWorld.y) * 1.4;
    }

    bodies.push(body);
    startWorld = null; curWorld = null; anchorBody = null;
  }

  canvas.addEventListener('mousedown', function(e){ pointerDown(e.clientX, e.clientY); });
  canvas.addEventListener('mousemove', function(e){ pointerMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', pointerUp);

  canvas.addEventListener('touchstart', function(e){
    var t = e.touches[0]; pointerDown(t.clientX, t.clientY); e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchmove', function(e){
    var t = e.touches[0]; pointerMove(t.clientX, t.clientY); e.preventDefault();

  canvas.addEventListener('touchend', function(e){ pointerUp(); e.preventDefault(); }, {passive:false});

  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var before = screenToWorld(e.clientX, e.clientY);
    var factor = Math.exp(-e.deltaY * 0.0012);
    camera.zoom = Math.min(8, Math.max(0.00001, camera.zoom * factor));
    var after = screenToWorld(e.clientX, e.clientY);
    camera.x += before.x - after.x;
    camera.y += before.y - after.y;
    var pct = camera.zoom * 100;
    var pctText = pct < 0.01 ? pct.toFixed(4) : (pct < 10 ? pct.toFixed(1) : Math.round(pct));
    zoomOut.textContent = pctText + '%';
  }, {passive:false});

  // ---- toolbar ----
  var modeSpawn = document.getElementById('modeSpawn');
  var modePan = document.getElementById('modePan');

  var presetBtns = {
    moon: document.getElementById('presetMoon'),
    planet: document.getElementById('presetPlanet'),
    gasGiant: document.getElementById('presetGasGiant'),
    star: document.getElementById('presetStar'),
    redGiant: document.getElementById('presetRedGiant'),

  };

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function(){

    playBtn.textContent = playing ? 'Pause' : 'Play';

  var timeScale = 1;

    speedOut.textContent = (timeScale >= 1000 ? Math.round(timeScale).toLocaleString() + 'x' : Math.round(timeScale * 100) + '%');

  var fsBtn = document.getElementById('fsBtn');

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateSpeedSliderWidth(){
    var fs = isFullscreen();
    speedRange.style.width = fs ? 'min(1400px, 78vw)' : 'min(600px, 55vw)';

  function toggleFullscreen(){
    if (!isFullscreen()){
      var el = document.documentElement;
      (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen() || Promise.resolve()).catch(function(){});
    } else {

    }

  fsBtn.addEventListener('click', toggleFullscreen);
