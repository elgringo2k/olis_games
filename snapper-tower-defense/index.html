  cvs.style.width = (GAME_W * scale) + 'px';

function toggleFullscreen() {

// ---- sound (WebAudio, no assets) ----
let ac, masterGain;
function beep(freq, dur, type='square', vol=0.06, slideTo=0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g).connect(masterGain);
  o.start(); o.stop(ac.currentTime + dur);
}
const sfx = {
  punch:  () => beep(160, 0.07, 'square', 0.05, 60),
  ting:   () => { beep(1600, 0.12, 'triangle', 0.05, 2400); beep(2400, 0.07, 'sine', 0.03); }, // blocked hit on armor
  bounce: () => beep(240, 0.08, 'square', 0.07, 120), // cannonball glancing off a rock/building
  cannon: () => {
    beep(55, 0.3, 'triangle', 0.24, 25); beep(220, 0.06, 'square', 0.07, 70);
    if (!ac) return;
    const len = ac.sampleRate * 0.3, buf = ac.createBuffer(1, len, ac.sampleRate); // deep muzzle-blast thump
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ac.createBufferSource(), g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 220; // filter out the hiss, keep the deep body
    src.buffer = buf; g.gain.value = 0.42;
    src.connect(lp).connect(g).connect(masterGain); src.start();
  },

  pop:    () => beep(400, 0.15, 'triangle', 0.08, 60),
  place:  () => beep(520, 0.1, 'sine', 0.08),

  upgrade:() => { beep(440, 0.09, 'sine', 0.08); setTimeout(() => beep(660, 0.12, 'sine', 0.08), 90); },

  missileBoom: () => { // quieter explosion for cannon missile/atomic missile impacts

    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = buf; g.gain.value = 0.07;
    src.connect(g).connect(masterGain); src.start();
  },
  boom:   () => {
    if (!ac) return;
    beep(140, 0.6, 'sawtooth', 0.18, 30);
    beep(70, 0.8, 'triangle', 0.2, 25);
    setTimeout(() => beep(100, 0.4, 'sawtooth', 0.1, 30), 150);
    // white-noise blast

// ---- background music: calm loop normally, energetic/tense loop for the round-10 and round-25 boss waves ----
const SCALE = [220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00]; // A natural minor
const TRACKS = {
  calm: {
    bpm: 96,
    // bass (14 steps) and lead (24 steps) are different lengths on purpose — their combination
    // doesn't fully repeat for 168 steps, so it doesn't feel like a short loop on replay
    bass: [0, 2, 3, 2, 4, 3, 2, 0, 3, 4, 2, 0, 3, 2],
    lead: [0, 2, 3, 4, 5, 4, 3, 2, 4, 5, 4, 3, 2, 3, 0, 2, 5, 4, 2, 0, 3, 4, 2, 0],
    bassWave: 'sine', bassVol: 0.045, leadWave: 'triangle', leadVol: 0.03, drums: false,
  },
  intense: {
    bpm: 152,
    // bass (16 steps) and lead (24 steps) are different lengths on purpose — their combination
    // doesn't fully repeat for 48 steps, so the loop feels much less like a short repeating riff
    bass: [0, 0, 0, 3, 0, 0, 4, 4, 3, 3, 0, 0, 4, 4, 3, 0],
    lead: [7, 6, 7, 6, 5, 4, 5, 4, 3, 2, 3, 2, 4, 5, 6, 7, 7, 4, 7, 4, 6, 3, 6, 3],
    bassWave: 'sawtooth', bassVol: 0.065, leadWave: 'square', leadVol: 0.045, drums: true,
  },
};
let musicMode = 'calm', musicStep = 0, musicTimer = null;
function scheduleMusic() {
  const trk = TRACKS[musicMode];
  const stepTime = 60 / trk.bpm / 2; // 8th notes
  if (state === 'playing') {
    const bassNote = trk.bass[musicStep % trk.bass.length];
    const leadNote = trk.lead[musicStep % trk.lead.length];
    if (bassNote >= 0) beep(SCALE[bassNote] / 2, stepTime * 0.9, trk.bassWave, trk.bassVol);
    if (leadNote >= 0) beep(SCALE[leadNote] * 2, stepTime * 0.4, trk.leadWave, trk.leadVol);
    if (trk.drums && musicStep % 2 === 0) beep(90, 0.06, 'triangle', 0.06); // low thump on the beat
    musicStep++;
  }
  musicTimer = setTimeout(scheduleMusic, stepTime * 1000);
}

// ---- decorations (seeded per map, so each layout always looks the same) ----
let rngState = 7;
const rng = () => (rngState = rngState * 16807 % 2147483647) / 2147483647;
const DECOR = [];
function rebuildDecor(seed) {
  rngState = seed;
  DECOR.length = 0;
  let tries = 0;
  while (DECOR.length < 60 && tries < 4000) {
    tries++;
    const x = 20 + rng()*920, y = 60 + rng()*520;
    if (distToPath(x, y) > PATH_W/2 + 20 && OBSTACLES.every(o => obstacleDist(o, x, y) > 24))
      DECOR.push({x, y, kind: Math.floor(rng()*3), s: 0.6 + rng()*0.8, hue: rng()});
  }

function leadAngle(fx, fy, e, projSpeed) {

  const b = 2*(rx*v.vx + ry*v.vy);

  if (Math.abs(a) < 1e-6) {

        t.thrown = (t.thrown||0) + 1;
        // jitsu: every shuriken is gold and does quadruple (180)
        const gold = t.p1 >= 4 || (t.p1 >= 2 && t.thrown % 2 === 0);
        const dmg = t.p1 >= 4 ? 180 : 45 * (gold ? 2 : 1);
        const spreads = t.p1 >= 4 ? [-0.4,-0.2,0,0.2,0.4] : [0];
        const dual = t.p1 === 3 ? [-7, 7] : [0];
        // smart targeting for regular throws (Snapper Jitsu's fan spread stays a straight read on t.angle)
        const throwAngle = (tgt && t.p1 < 4) ? leadAngle(t.x, t.y, tgt, 420) : t.angle;
        for (const a of spreads) for (const o of dual) {
          const ang = throwAngle + a;
          shots.push({x:t.x - Math.sin(ang)*o, y:t.y + Math.cos(ang)*o,
            vx:Math.cos(ang)*420, vy:Math.sin(ang)*420,
            dmg, gold, pierce, hit:[], life:(range+50)/420, spin:0, src:t});
        }
        beep(700, 0.05, 'square', 0.03, 900); // whoosh
      }
      // path 2: caltrops
      if (t.p2 >= 1 && t.trapCd <= 0) {
        t.trapCd = 2;
        const spots = PATH_PTS.filter(p => Math.hypot(p.x-t.x, p.y-t.y) <= range);
        if (spots.length) {
          const s = spots[Math.floor(Math.random()*spots.length)];
          t.dropped = (t.dropped||0) + 1;
          const golden = t.p2 >= 2 && t.dropped % 10 === 0;
          traps.push({x:s.x, y:s.y, type:'caltrop', dmg:golden ? 250 : 25, life:golden ? 30 : 10, golden, src:t});
        }
      }
      // path 2 tier 3+: sticky / boss bombs
      if (t.p2 >= 3 && t.bombCd <= 0) {
        t.bombCd = 5;
        const spots = PATH_PTS.filter(p => Math.hypot(p.x-t.x, p.y-t.y) <= range);
        if (spots.length) {
          const s = spots[Math.floor(Math.random()*spots.length)];
          const bossNear = t.p2 >= 4 && enemies.some(e => e.boss && !e.dead && Math.hypot(e.x-t.x, e.y-t.y) <= range);
          traps.push({x:s.x, y:s.y, type:'bomb', dmg:bossNear ? 15000 : 250, life:30, bossBomb:bossNear, src:t});
        }
      }
    }
  }

  // banking documents: fly out to their resting spot, age, and either get collected (hover/tap) or expire
  for (const d of docs) {
    const dx = d.tx - d.x, dy = d.ty - d.y, dist = Math.hypot(dx, dy);
    if (dist > 2) { const m = Math.min(240 * dt, dist); d.x += dx/dist*m; d.y += dy/dist*m; }
    d.age += dt;
  }
  docs = docs.filter(d => {
    if (Math.hypot(mouse.x-d.x, mouse.y-d.y) <= DOC_GRAB_R) { collectDoc(d); return false; } // desktop: just hover, no click needed
    return d.age < 20; // 20s uncollected and it's gone for good
  });

  // shurikens fly (ninjarie sees camo, so shurikens hit everything)
  for (const s of shots) {
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt; s.spin += 15*dt;
    if (s.cannon && !s.missile) { // cannonballs (and grape shot) bounce off rocks and buildings, not water
      for (const o of OBSTACLES) {
        if (o.type === 'water') continue;
        const dx = s.x - o.x, dy = s.y - o.y, dist = Math.hypot(dx, dy), minD = o.r + (s.ballR||6);
        if (dist > 0.001 && dist < minD) {
          const nx = dx/dist, ny = dy/dist, dot = s.vx*nx + s.vy*ny;
          if (dot < 0) {
            s.vx -= 2*dot*nx; s.vy -= 2*dot*ny;
            s.x = o.x + nx*minD; s.y = o.y + ny*minD;
            sfx.bounce();
            burst(s.x, s.y, '#ccc', 5, 90, 2);
          }
        }
      }
    } else if (s.cannon && s.missile) { // missiles/atomic missiles detonate the instant they clip a building
      for (const o of OBSTACLES) {
        if (o.type !== 'building' || Math.hypot(s.x-o.x, s.y-o.y) > o.r) continue;
        missileExplode(s);
        break;
      }
    } else if (!s.icbm) { // shurikens (and anything else non-cannon) are simply stopped by a building
      for (const o of OBSTACLES) {
        if (o.type !== 'building' || Math.hypot(s.x-o.x, s.y-o.y) > o.r) continue;
        burst(s.x, s.y, '#999', 4, 70, 2);
        s.life = 0;
        break;
      }
    }
    if (!s.icbm && (s.x < -40 || s.x > 1140 || s.y < -40 || s.y > 640)) s.life = 0; // off the map
    if (s.icbm) { // steer at the target's live position every frame — it can't miss
      if (s.tgt && !s.tgt.dead) { s.tx = s.tgt.x; s.ty = s.tgt.y; }
      const d = Math.hypot(s.tx - s.x, s.ty - s.y);
      particles.push({x:s.x, y:s.y, vx:-s.vx*0.1, vy:-s.vy*0.1, life:0.3, maxLife:0.3, r:3, color:'#bbb', drag:2}); // smoke trail
      if (d < 16) { // impact
        boom(s.tx, s.ty, '#aef05a');
        for (const e of [...enemies]) {
          if (e.dead || e.camo || Math.hypot(e.x-s.tx, e.y-s.ty) > s.blastR) continue;
          if (s.src) s.src.dmgDone += Math.min(s.dmg, e.hp);
          e.hp -= s.dmg;
          if (e.hp <= 0) kill(e, s.src);
        }
        s.life = 0;
      } else { s.vx = (s.tx - s.x)/d*480; s.vy = (s.ty - s.y)/d*480; }
      continue;
    }
    for (const e of enemies) {
      if (e.dead || s.hit.includes(e) || Math.hypot(e.x-s.x, e.y-s.y) > e.r + 4) continue;
      if (s.cannon && e.camo) continue; // the cannon can't touch camo
      if (s.missile) { missileExplode(s); break; } // explodes on contact; the blast hurts steel too
      s.hit.push(e); s.pierce--;
      burst(e.x, e.y, s.cannon ? '#777' : s.gold ? '#ffe97a' : '#ddd', 3, 80, 2);
      if (!e.armored || s.popsSteel) { if (s.src) s.src.dmgDone += Math.min(s.dmg, e.hp); e.hp -= s.dmg; if (e.hp <= 0) kill(e, s.src); }
      else sfx.ting();
      if (s.pierce <= 0) { s.life = 0; break; }
    }
  }
  shots = shots.filter(s => s.life > 0);

  // traps trigger underfoot
  for (const tr of traps) {
    tr.life -= dt;
    const victim = enemies.find(e => !e.dead && Math.hypot(e.x-tr.x, e.y-tr.y) < e.r + 4);
    if (!victim) continue;
    tr.life = 0;
    if (tr.type === 'bomb') {
      sfx.boom();
      shake = Math.max(shake, tr.bossBomb ? 0.4 : 0.2);
      particles.push({x:tr.x, y:tr.y, ring:true, r:8, vr:120, life:0.35, maxLife:0.35, color:'#f0955c'});
      burst(tr.x, tr.y, '#f0955c', 25, 220, 5, 0.6);
      for (const e of [...enemies]) {
        if (e.dead || Math.hypot(e.x-tr.x, e.y-tr.y) > 55) continue;
        if (tr.src) tr.src.dmgDone += Math.min(tr.dmg, e.hp);
        e.hp -= tr.dmg;
        if (e.hp <= 0) kill(e, tr.src);
      }
    } else {
      burst(tr.x, tr.y, tr.golden ? '#ffe97a' : '#999', 6, 100, 2.5);
      if (!victim.armored) { if (tr.src) tr.src.dmgDone += Math.min(tr.dmg, victim.hp); victim.hp -= tr.dmg; if (victim.hp <= 0) kill(victim, tr.src); }
      else sfx.ting();
    }
  }
  traps = traps.filter(tr => tr.life > 0);

  enemies = enemies.filter(e => !e.dead);

  for (const p of particles) {
    if (p.ring) { p.r += p.vr*dt; }
    else {
      p.x += p.vx*dt; p.y += p.vy*dt;
      const k = 1 - (p.drag||0)*dt;
      p.vx *= k; p.vy *= k;
    }
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
  for (const t of texts) { t.y -= 30*dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);

  if (lives <= 0) { state = 'lost'; sfx.lose(); }
  else if (waveActive && !spawnQueue.length && !enemies.length && !particles.length) {
    waveActive = false; money += 150;
    musicMode = 'calm';
    if (!sandbox && wave >= WAVES.length) { state = 'won'; sfx.win(); }
    else sfx.clear();
  }
}

// ---- draw ----
function drawBackground() {
  ctx.fillStyle = THEME_COLORS[THEME].bg;
  ctx.fillRect(0, 0, 1100, 600);
}
function drawPath() {
  const c = THEME_COLORS[THEME];
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = c.pathOuter; ctx.lineWidth = PATH_W + 8;
  ctx.beginPath(); PATH.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.strokeStyle = c.pathInner; ctx.lineWidth = PATH_W;
  ctx.stroke();
  // dashed centre stripe
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
  ctx.setLineDash([14, 18]);
  ctx.beginPath(); PATH.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.setLineDash([]);
}
function drawObstacles() {
  for (const o of OBSTACLES) {
    if (o.type === 'water') {
      ctx.fillStyle = '#3a6fa5';
      if (o.w) { // river / basin strip
        ctx.fillRect(o.x-o.w/2, o.y-o.h/2, o.w, o.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
        const wavy = o.w > o.h; // ripple lines run along the long axis
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          if (wavy) ctx.moveTo(o.x-o.w/2+8, o.y+k*o.h*0.28), ctx.lineTo(o.x+o.w/2-8, o.y+k*o.h*0.28);
          else ctx.moveTo(o.x+k*o.w*0.28, o.y-o.h/2+8), ctx.lineTo(o.x+k*o.w*0.28, o.y+o.h/2-8);
          ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.6, 0, 5); ctx.stroke();
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.85, 1, 4); ctx.stroke();
      }
    } else if (o.type === 'building') { // ancient stone pillar, seen from directly above
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; // drop shadow implies height
      ctx.beginPath(); ctx.arc(o.x+4, o.y+4, o.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#a89a7c';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#8f8267';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.78, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
      for (let a = 0; a < 6.3; a += Math.PI/6) { // fluting grooves radiating from the column's core
        ctx.beginPath();
        ctx.moveTo(o.x+Math.cos(a)*o.r*0.32, o.y+Math.sin(a)*o.r*0.32);
        ctx.lineTo(o.x+Math.cos(a)*o.r*0.95, o.y+Math.sin(a)*o.r*0.95);
        ctx.stroke();
      }
      ctx.strokeStyle = '#4f4736'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(120,140,90,0.35)'; // moss creeping up one side
      ctx.beginPath(); ctx.ellipse(o.x-o.r*0.3, o.y+o.r*0.35, o.r*0.35, o.r*0.22, 0.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o.x+o.r*0.15, o.y-o.r*0.45, o.r*0.22, o.r*0.14, 1.1, 0, 7); ctx.fill();
    } else if (o.type === 'container') { // shipping container, top-down
      ctx.save(); ctx.translate(o.x, o.y);
      ctx.fillStyle = '#a5453a';
      ctx.fillRect(-o.r, -o.r*0.6, o.r*2, o.r*1.2);
      ctx.strokeStyle = '#5c241d'; ctx.lineWidth = 2;
      ctx.strokeRect(-o.r, -o.r*0.6, o.r*2, o.r*1.2);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
      for (let rx = -o.r+6; rx < o.r; rx += 7) { ctx.beginPath(); ctx.moveTo(rx, -o.r*0.6+2); ctx.lineTo(rx, o.r*0.6-2); ctx.stroke(); }
      ctx.restore();
    } else if (o.type === 'crane') { // gantry crane, top-down: a boom arm swung across a fixed base — every part scales with o.r, so a huge crane still reads as sturdy rather than a thin wire
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(0.5);
      ctx.strokeStyle = '#e8b93d'; ctx.lineWidth = o.r*0.27; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-o.r*1.6, 0); ctx.lineTo(o.r*1.1, 0); ctx.stroke();
      ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = o.r*0.09;
      ctx.beginPath(); ctx.moveTo(-o.r*1.6, 0); ctx.lineTo(o.r*1.1, 0); ctx.stroke();
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath(); ctx.arc(0, 0, o.r*0.32, 0, 7); ctx.fill(); // slewing base
      ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = o.r*0.07;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(o.r*1.1, -o.r*0.18); ctx.stroke(); // hook cable
      ctx.restore();
    } else { // rock / boulder
      ctx.fillStyle = '#7d7d78';
      ctx.beginPath(); ctx.ellipse(o.x, o.y, o.r, o.r*0.8, 0.3, 0, 7); ctx.fill();
      ctx.fillStyle = '#9a9a92';
      ctx.beginPath(); ctx.ellipse(o.x-o.r*0.25, o.y-o.r*0.25, o.r*0.5, o.r*0.35, 0.3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#4a4a45'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(o.x, o.y, o.r, o.r*0.8, 0.3, 0, 7); ctx.stroke();
    }
  }
}

function drawDecor() {
  const pal = THEME_DECOR[THEME];
  for (const d of DECOR) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.s, d.s);
    if (d.kind === 0) { // bush-shaped clump
      ctx.fillStyle = pal[0][0];
      ctx.beginPath(); ctx.arc(-6,2,8,0,7); ctx.arc(6,2,8,0,7); ctx.arc(0,-5,9,0,7); ctx.fill();
      ctx.fillStyle = pal[0][1];
      ctx.beginPath(); ctx.arc(-3,-2,6,0,7); ctx.arc(4,0,5,0,7); ctx.fill();
    } else if (d.kind === 1) { // dot-cluster (flower / sparkle / rubble)
      ctx.fillStyle = d.hue > 0.5 ? pal[1][0] : pal[1][1];
      for (let i = 0; i < 5; i++) {
        const a = i/5*7;
        ctx.beginPath(); ctx.arc(Math.cos(a)*4, Math.sin(a)*4, 3, 0, 7); ctx.fill();
      }
      ctx.fillStyle = THEME === 'ruins' ? '#666' : '#e8a33d'; ctx.beginPath(); ctx.arc(0,0,2.5,0,7); ctx.fill();
    } else { // small rock / block
      ctx.fillStyle = pal[2][0];
      ctx.beginPath(); ctx.ellipse(0,0,9,6,0.3,0,7); ctx.fill();
      ctx.fillStyle = pal[2][1];
      ctx.beginPath(); ctx.ellipse(-2,-2,5,3,0.3,0,7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawShuriken(x, y, spin, gold, size) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(spin);
  ctx.fillStyle = gold ? '#ffe97a' : '#ccc';
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.lineTo(Math.cos(i*1.57)*size, Math.sin(i*1.57)*size);
    ctx.lineTo(Math.cos(i*1.57 + 0.785)*size*0.36, Math.sin(i*1.57 + 0.785)*size*0.36);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawSnapper(x, y, angle, spr, scale, kind='doba') {
  const set = SPRS[kind], img = set.img();
  if (!img.complete) return;
  const s = set[spr];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const w = s.w*scale, h = s.h*scale;
  ctx.drawImage(img, s.x, s.y, s.w, s.h, -w/2, -h*0.45, w, h);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,1100,600);

  if (state === 'title') {
    ctx.fillStyle = '#234a23'; ctx.fillRect(0,0,1100,600);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#aef05a'; ctx.font = 'bold 44px system-ui';
    ctx.fillText('SNAPPER', 550, 68);
    ctx.fillText('TOWER DEFENSE', 550, 116);
    // big snapper filling the gap between the title and the map picker
    if (sheet.complete) drawSnapper(550, 203, 0, 'idle', 1.1);
    // map picker
    ctx.fillStyle = '#cbe8b0'; ctx.font = 'bold 15px system-ui';
    ctx.fillText('CHOOSE A MAP', 550, 300);
    for (let i = 0; i < MAPS.length; i++) {
      const b = mapBtn(i);
      ctx.fillStyle = i === mapIndex ? '#aef05a' : 'rgba(255,255,255,0.12)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = i === mapIndex ? '#fff' : '#8ab86a'; ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = i === mapIndex ? '#1a2a1a' : '#cbe8b0';
      ctx.font = 'bold 12px system-ui';
      ctx.fillText(MAPS[i].name, b.x + b.w/2, b.y + 21);
    }
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
    ctx.fillText('Blobs are invading. Only the Snappers can punch them back.', 550, 420);
    ctx.fillStyle = Math.floor(Date.now()/500)%2 ? '#ffe97a' : '#fff';
    ctx.font = 'bold 27px system-ui';
    ctx.fillText('CLICK TO START', 550, 465);
    ctx.strokeStyle = '#8ab86a'; ctx.lineWidth = 2;
    ctx.strokeRect(440, 488, 220, 34);
    ctx.fillStyle = '#8ab86a'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('SANDBOX MODE', 550, 510);
    return;
  }

  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake*30, (Math.random()-0.5)*shake*30);

  drawBackground();
  drawObstacles();
  drawPath();
  drawDecor();

  // enemies
  for (const e of enemies) {
    if (e.ultraCamo && ultraCamoSheet.complete) {
      ctx.drawImage(ultraCamoSheet, ULTRACAMO_SPR.x, ULTRACAMO_SPR.y, ULTRACAMO_SPR.w, ULTRACAMO_SPR.h, e.x-e.r-2, e.y-e.r-2, (e.r+2)*2, (e.r+2)*2);
    } else if (e.camo && camoSheet.complete) {
      ctx.drawImage(camoSheet, CAMO_SPR.x, CAMO_SPR.y, CAMO_SPR.w, CAMO_SPR.h, e.x-e.r-2, e.y-e.r-2, (e.r+2)*2, (e.r+2)*2);
    } else if (e.ultraSteel) { // bolted steel plates: heavier gradient plus a seam and rivets
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7);
      ctx.fillStyle = ULTRASTEEL_GRAD; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#1c1c1c'; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-e.r*0.8, 0); ctx.lineTo(e.r*0.8, 0); ctx.stroke();
      const rivetR = e.r * 0.16;
      for (const [rx, ry] of [[-e.r*0.55,-e.r*0.4],[e.r*0.55,-e.r*0.4],[-e.r*0.55,e.r*0.4],[e.r*0.55,e.r*0.4],[0,0]]) {
        ctx.fillStyle = '#4a4a4a';
        ctx.beginPath(); ctx.arc(rx, ry, rivetR, 0, 7); ctx.fill();
        ctx.fillStyle = '#9a9a9a';
        ctx.beginPath(); ctx.arc(rx-rivetR*0.3, ry-rivetR*0.3, rivetR*0.4, 0, 7); ctx.fill();
      }
      ctx.restore();
    } else if (e.steel) { // brushed-steel look: dark top-left fading to light bottom-right, like the sheet
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7);
      ctx.fillStyle = STEEL_GRAD; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#333'; ctx.stroke();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7);
      ctx.fillStyle = e.color; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#333'; ctx.stroke();
    }
    if (e.boss) { // boss double ring, like the sheet
      ctx.strokeStyle = e.ringColor || '#333';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r-7, 0, 7); ctx.stroke();
    }
    // hp bar
    ctx.fillStyle = '#300'; ctx.fillRect(e.x-16, e.y-e.r-10, 32, 5);
    ctx.fillStyle = '#4f4'; ctx.fillRect(e.x-16, e.y-e.r-10, 32*e.hp/e.maxHp, 5);
  }

  // traps (under towers)
  for (const tr of traps) {
    if (tr.type === 'bomb') {
      ctx.fillStyle = tr.bossBomb ? '#8a1f1f' : '#222';
      ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.bossBomb ? 10 : 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#f0955c';
      ctx.beginPath(); ctx.arc(tr.x - 2, tr.y - (tr.bossBomb ? 11 : 8), 2, 0, 7); ctx.fill(); // fuse spark
    } else {
      ctx.strokeStyle = tr.golden ? '#e8b93d' : '#444'; ctx.lineWidth = tr.golden ? 3 : 2;
      const r = tr.golden ? 7 : 5;
      for (let i = 0; i < 3; i++) {
        const a = i*2.094 - 1.57;
        ctx.beginPath(); ctx.moveTo(tr.x, tr.y); ctx.lineTo(tr.x + Math.cos(a)*r, tr.y + Math.sin(a)*r); ctx.stroke();
      }
    }
  }

  // towers
  for (const t of towers) {
    let spr;
    if (t.kind === 'ninjarie') spr = t.windup ? 'punchR' : t.anim > 0 ? 'punchL' : 'idle'; // back → forward → idle
    else if (t.kind === 'cannon') spr = t.anim > 0 ? 'punchR' : t.recoil > 0 ? 'punchL' : 'idle'; // fire → recoil → idle
    else if (t.kind === 'bankingDoba') spr = Math.floor(Date.now()/400) % 2 === 0 ? 'idle' : 'idle2'; // gentle two-frame idle
    else spr = t.anim > 0 ? (t.fist ? 'punchR' : 'punchL') : 'idle';
    drawSnapper(t.x, t.y, t.angle - Math.PI/2, spr, 0.32 + (t.p1 + t.p2)*0.02, t.kind);
    if (t.kind === 'ninjarie' && t.windup) { // shuriken in the raised hand
      const a = t.angle - Math.PI/2;
      drawShuriken(t.x + Math.cos(a)*40 - Math.sin(a)*20, t.y + Math.sin(a)*40 + Math.cos(a)*20, Date.now()/100, false, 6);
    }
    // path pips: cyan = path 1, gold = path 2
    ctx.fillStyle = '#6ad8f0';
    for (let i = 0; i < t.p1; i++) { ctx.beginPath(); ctx.arc(t.x - 20 + i*11, t.y + 28, 3.5, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#ffe97a';
    for (let i = 0; i < t.p2; i++) { ctx.beginPath(); ctx.arc(t.x - 20 + i*11, t.y + 38, 3.5, 0, 7); ctx.fill(); }
    // selected tower: total damage dealt & kills, just this one tower (not its whole type)
    // the upgrade panel sits above the tower normally, or below it when the tower is near the top of the map —
    // so put these stats on whichever side the panel ISN'T, or the panel can cover them
    if (t === selected) {
      const panelBelow = t.y <= 190;
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px system-ui';
      if (t.kind === 'bankingDoba') {
        const moneyY = t.y + (panelBelow ? -50 : 50);
        ctx.fillStyle = '#000'; ctx.fillText('MONEY MADE $' + fmtDmg(t.moneyMade), t.x + 1, moneyY + 1);
        ctx.fillStyle = '#ffe97a'; ctx.fillText('MONEY MADE $' + fmtDmg(t.moneyMade), t.x, moneyY);
      } else {
        const dmgY = t.y + (panelBelow ? -50 : 50), killY = t.y + (panelBelow ? -62 : 62);
        ctx.fillStyle = '#000';
        ctx.fillText('DMG ' + fmtDmg(t.dmgDone), t.x + 1, dmgY + 1);
        ctx.fillText('KILLS ' + t.kills, t.x + 1, killY + 1);
        ctx.fillStyle = '#ffe97a';
        ctx.fillText('DMG ' + fmtDmg(t.dmgDone), t.x, dmgY);
        ctx.fillStyle = '#8ef0ff';
        ctx.fillText('KILLS ' + t.kills, t.x, killY);
      }
      ctx.textAlign = 'left';
    }
  }

  // banking documents & crates — the real cropped artwork, same sprites as drawn
  for (const d of docs) {
    if (d.age >= 15 && Math.floor(d.age * 6) % 2 === 0) continue; // flashes for its last 5 seconds
    if (bankingDobaSheet.complete) {
      const s = d.crate ? CRATE_SPR : DOC_SPR;
      ctx.drawImage(bankingDobaSheet, s.x, s.y, s.w, s.h, d.x - s.w/2, d.y - s.h/2, s.w, s.h);
    }
    ctx.textAlign = 'center'; ctx.font = 'bold 10px system-ui';
    ctx.fillStyle = '#000'; ctx.fillText('$'+d.value, d.x+1, d.y+31);
    ctx.fillStyle = '#ffe97a'; ctx.fillText('$'+d.value, d.x, d.y+30);
  }

  // shurikens
  for (const s of shots) {
    if (s.icbm) { // the big one
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#ffe97a'; // exhaust flame
      ctx.beginPath(); ctx.moveTo(-18, -5); ctx.lineTo(-30 - Math.random()*10, 0); ctx.lineTo(-18, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1e3d1e';
      ctx.fillRect(-18, -7, 30, 14);
      ctx.fillStyle = '#aef05a';
      ctx.beginPath(); ctx.moveTo(12, -7); ctx.lineTo(26, 0); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (s.missile) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = s.atomic ? '#1e3d1e' : '#666'; // atomic missiles look green and black
      ctx.fillRect(-9, -3.5, 14, 7);
      ctx.fillStyle = s.atomic ? '#aef05a' : '#f07070';
      ctx.beginPath(); ctx.moveTo(5, -3.5); ctx.lineTo(11, 0); ctx.lineTo(5, 3.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (s.cannon) {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.ballR, 0, 7);
      ctx.fillStyle = '#2b2b2b'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();
    } else drawShuriken(s.x, s.y, s.spin, s.gold, 7);
  }

  // particles & floating cash
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life/p.maxLife, 0);
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 15px system-ui';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(t.life/0.4, 1);
    ctx.fillStyle = '#ffe97a'; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // selected tower: range + one upgrade button per path
  if (selected) {
    const t = selected, icons = TKINDS[t.kind].icons;
    ctx.beginPath(); ctx.arc(t.x, t.y, twrRange(t), 0, 7);
    ctx.strokeStyle = 'rgba(255,233,122,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    const bx = Math.max(125, Math.min(835, t.x)), by = t.y > 190 ? t.y - 130 : t.y + 56;
    [[1, icons[0], '#6ad8f0'], [2, icons[1], '#ffe97a']].forEach(([path, icon, color], row) => {
      const n = pathNext(t, path), y = by + row*38;
      const btn = {x:bx-115, y, w:230, h:32};
      t['btn'+path] = n.def && !n.locked ? btn : null;
      ctx.fillStyle = n.def && !n.locked ? (money >= n.def.cost ? color : '#999') : '#555';
      ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
      ctx.fillStyle = '#000'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
      const label = n.maxed ? icon+' MAX' : n.locked ? icon+' 🔒 path locked' : `${icon} ${n.def.name} $${n.def.cost}`;
      ctx.fillText(label, bx, y+21);
    });
    // sell button
    t.btnS = {x:bx-115, y:by+76, w:230, h:26};
    ctx.fillStyle = '#c96a5a';
    ctx.fillRect(t.btnS.x, t.btnS.y, t.btnS.w, t.btnS.h);
    ctx.fillStyle = '#000'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('SELL +$' + Math.round(t.spent * 0.8), bx, by + 94);
  }

  // ability bar: one icon per tower with an ability, bottom-left
  abilityBtns = [];
  let ax = 20;
  for (const t of towers) {
    const p2def = TKINDS[t.kind].paths[1][t.p2];
    if (!p2def.aoe && !p2def.icbm) continue;
    const btn = {x:ax, y:540, w:44, h:44, t};
    abilityBtns.push(btn);
    const ready = t.aoeCd <= 0;
    ctx.fillStyle = ready ? '#ffe97a' : '#666';
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
    ctx.font = '26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(p2def.icbm ? '\uD83D\uDE80' : p2def.aoe >= 10000 ? '☢️' : '👊', btn.x + 22, btn.y + 32);
    if (!ready) { // cooldown sweep
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(btn.x, btn.y, btn.w, btn.h * t.aoeCd / AOE_CD);
    }
    ax += 52;
  }

  // placement preview (only while a tower is picked from the sidebar)
  if (state === 'playing' && placing && mouse.x > 0 && mouse.x < SIDEBAR.x) {
    const def = TKINDS[placing];
    const ok = canPlace(mouse.x, mouse.y) && money >= def.cost;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, def.range, 0, 7);
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.15)' : 'rgba(255,60,60,0.15)';
    ctx.fill();
    ctx.strokeStyle = ok ? 'rgba(255,255,255,0.5)' : 'rgba(255,60,60,0.5)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 0.6; drawSnapper(mouse.x, mouse.y, 0, 'idle', 0.32, placing); ctx.globalAlpha = 1;
  }

  // sidebar
  ctx.fillStyle = '#1d3a1d'; ctx.fillRect(SIDEBAR.x, 0, 140, 600);
  ctx.textAlign = 'center'; ctx.fillStyle = '#aef05a'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('TOWERS', 1030, 66);
  for (const c of SIDEBAR.cards) {
    const def = TKINDS[c.kind], afford = money >= def.cost, armed = placing === c.kind;
    ctx.fillStyle = armed ? '#4a7a3a' : '#2b512b';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.lineWidth = 3;
    ctx.strokeStyle = armed ? '#ffe97a' : (afford ? '#6a9a5a' : '#555');
    ctx.strokeRect(c.x, c.y, c.w, c.h);
    ctx.fillStyle = '#cde3cd'; ctx.font = 'bold 12px system-ui';
    ctx.fillText(def.name, c.x + c.w/2, c.y + 16);
    ctx.globalAlpha = afford ? 1 : 0.4;
    drawSnapper(c.x + c.w/2, c.y + 55, 0, 'idle', c.kind === 'bankingDoba' ? 0.16 : 0.26, c.kind); // banking doba's sheet art is much bigger than the others, so shrink just its card preview
    ctx.globalAlpha = 1;
    ctx.fillStyle = afford ? '#ffe97a' : '#888'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('$' + def.cost, c.x + c.w/2, c.y + c.h - 10);
    const cap = def.seesCamo ? 'sees camo' : def.note;
    if (cap) { ctx.fillStyle = '#9db89d'; ctx.font = '11px system-ui'; ctx.fillText(cap, c.x + c.w/2, c.y + c.h + 14); }
  }
  ctx.fillStyle = '#9db89d'; ctx.font = '12px system-ui';
  ctx.fillText(placing ? 'click grass to place' : 'click a card to buy', 1030, 566);

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,1100,44);
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffe97a'; ctx.font = 'bold 20px system-ui';
  ctx.fillText(money === Infinity ? '$∞' : '$' + money, 20, 29);
  ctx.fillStyle = '#ff8a8a'; ctx.fillText('♥ ' + (lives === Infinity ? '∞' : lives), 130, 29);
  ctx.fillStyle = '#fff'; ctx.fillText('Wave ' + wave + '/' + WAVES.length, 230, 29);
  if (sandbox && !waveActive) { // wave picker arrows
    ctx.fillStyle = '#ffe97a'; ctx.font = 'bold 20px system-ui';
    ctx.fillText('◀', 355, 29); ctx.fillText('▶', 385, 29);
  }
  ctx.fillStyle = '#ccc'; ctx.font = '16px system-ui';
  ctx.fillText(sandbox ? 'SANDBOX · pick any wave with ◀ ▶' : 'Click a Snapper to upgrade · Esc cancels', 425, 28);

  // start wave button
  if (!waveActive && state === 'playing') {
    ctx.fillStyle = '#ffe97a'; ctx.fillRect(810, 6, 140, 32);
    ctx.fillStyle = '#000'; ctx.font = 'bold 17px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(wave === 0 ? 'START WAVE' : 'NEXT WAVE', 880, 28);
  }

  if (state === 'won' || state === 'lost') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,1100,600);
    ctx.textAlign = 'center'; ctx.font = 'bold 56px system-ui';
    ctx.fillStyle = state === 'won' ? '#aef05a' : '#ff8a8a';
    ctx.fillText(state === 'won' ? 'SNAPPERS WIN!' : 'THE BLOBS GOT THROUGH', 550, 280);
    ctx.fillStyle = '#fff'; ctx.font = '24px system-ui';
    ctx.fillText('Click to return to title', 550, 340);
  }
  ctx.restore();
}

// ---- input ----
function evtPos(e) {
  const r = cvs.getBoundingClientRect();
  return {x:(e.clientX - r.left) * cvs.width / r.width, y:(e.clientY - r.top) * cvs.height / r.height};
}
cvs.addEventListener('mousemove', e => mouse = evtPos(e));
cvs.addEventListener('click', e => {
  if (!ac) { ac = new AudioContext(); masterGain = ac.createGain(); masterGain.gain.value = 3; masterGain.connect(ac.destination); scheduleMusic(); } // audio needs a user gesture
  const p = evtPos(e);
  if (state === 'title') {
    for (let i = 0; i < MAPS.length; i++) {
      const b = mapBtn(i);
      if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) { selectMap(i); return; }
    }
    const sb = p.x >= 440 && p.x <= 660 && p.y >= 488 && p.y <= 522;
    reset(sb); state = 'playing';
    return;
  }
  if (state === 'won' || state === 'lost') { state = 'title'; return; }
  // wave button
  if (!waveActive && p.x > 810 && p.x < 950 && p.y < 44) { startWave(); return; }
  // sandbox wave picker arrows
  if (sandbox && !waveActive && p.y < 44 && p.x > 345 && p.x < 405) {
    wave = Math.max(0, Math.min(WAVES.length - 1, wave + (p.x < 375 ? -1 : 1)));
    return;
  }
  // sidebar tower cards: arm/disarm placement
  for (const c of SIDEBAR.cards) {
    if (p.x >= c.x && p.x <= c.x+c.w && p.y >= c.y && p.y <= c.y+c.h) {
      if (money >= TKINDS[c.kind].cost) { placing = placing === c.kind ? null : c.kind; selected = null; }
      return;
    }
  }
  if (p.x >= SIDEBAR.x) return;
  // banking documents: a tap collects one directly, since mobile has no hover to trigger the per-frame check
  for (let i = 0; i < docs.length; i++) {
    if (Math.hypot(p.x-docs[i].x, p.y-docs[i].y) <= DOC_GRAB_R) { collectDoc(docs[i]); docs.splice(i, 1); return; }
  }
  // ability bar
  for (const b of abilityBtns) {
    if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) { slam(b.t); return; }
  }
  // placing mode: click grass to drop the tower
  if (placing) {
    if (money >= TKINDS[placing].cost && canPlace(p.x, p.y)) {
      money -= TKINDS[placing].cost;
      towers.push({x:p.x, y:p.y, kind:placing, spent:TKINDS[placing].cost, p1:0, p2:0, cd:0, aoeCd:0, trapCd:0, bombCd:0, docCd:0, crateCd:0, roundWave:-1, roundCount:0, spawnPhaseLen:8, anim:0, recoil:0, angle:Math.PI/2, fist:false, dmgDone:0, kills:0, moneyMade:0});
      sfx.place();
      placing = null;
    }
    return;
  }
  // upgrade buttons of the selected tower
  if (selected) {
    for (const path of [1, 2]) {
      const b = selected['btn'+path];
      if (!b || p.x < b.x || p.x > b.x+b.w || p.y < b.y || p.y > b.y+b.h) continue;
      const n = pathNext(selected, path);
      if (n.def && !n.locked && money >= n.def.cost) {
        money -= n.def.cost;
        selected.spent += n.def.cost;
        path === 1 ? selected.p1++ : selected.p2++;
        selectedAt = performance.now(); sfx.upgrade();
      }
      return;
    }
    // sell button: 80% of everything spent on this tower
    const b = selected.btnS;
    if (b && p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) {
      money += Math.round(selected.spent * 0.8);
      burst(selected.x, selected.y, '#ffe97a', 15, 150, 4);
      texts.push({x:selected.x, y:selected.y-20, life:0.8, str:'+$'+Math.round(selected.spent*0.8)});
      towers = towers.filter(t => t !== selected);
      selected = null;
      sfx.pop();
      return;
    }
  }
  // select a tower; any other click deselects
  const hit = towers.find(t => Math.hypot(t.x-p.x, t.y-p.y) < 30);
  selected = (hit && hit !== selected) ? hit : null;
  if (selected) selectedAt = performance.now();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { selected = null; placing = null; }
  if (e.code === 'Space' && state === 'playing' && !waveActive) {
    e.preventDefault(); // don't let the page scroll
    if (!ac) { ac = new AudioContext(); masterGain = ac.createGain(); masterGain.gain.value = 3; masterGain.connect(ac.destination); scheduleMusic(); } // audio needs a user gesture
    startWave();
  }
});

// ---- loop ----
let last = performance.now();
function loop(now) {
  update(Math.min((now - last)/1000, 0.05));
  last = now;
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
