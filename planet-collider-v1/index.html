<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet collider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --space:#120d2b; --space-deep:#07051a;
  --panel:rgba(28,22,62,.74); --panel-line:rgba(190,178,255,.16);
  --ink:#efeaff; --muted:#a59dcf; --lilac:#cfc5ff; --lilac-ink:#1c1540;
  --magma:#ff8a3d; --track:rgba(207,197,255,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:rgba(241,237,255,.86); --panel-line:rgba(60,40,140,.14);
    --ink:#1d1640; --muted:#5d5490; --lilac:#3c2f8f; --lilac-ink:#f4f1ff; --track:rgba(60,40,140,.2);
    --magma:#c4501a;
  }
}
:root[data-theme="light"]{
  --panel:rgba(241,237,255,.86); --panel-line:rgba(60,40,140,.14);
  --ink:#1d1640; --muted:#5d5490; --lilac:#3c2f8f; --lilac-ink:#f4f1ff; --track:rgba(60,40,140,.2); --magma:#c4501a;
}
:root[data-theme="dark"]{
  --panel:rgba(28,22,62,.74); --panel-line:rgba(190,178,255,.16);
  --ink:#efeaff; --muted:#a59dcf; --lilac:#cfc5ff; --lilac-ink:#1c1540; --track:rgba(207,197,255,.22); --magma:#ff8a3d;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--space-deep);color:var(--ink);font:400 15px/1.45 Figtree,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
h1{font:700 clamp(22px,3.4vw,34px)/1 Unbounded,"Arial Black",sans-serif;letter-spacing:-.02em;margin:0;color:#f3efff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.sub{margin:8px 0 0;color:#b7aee0;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.stats{display:flex;gap:22px;text-align:right}
.stat b{display:block;font:500 20px/1.1 Unbounded,"Arial Black",sans-serif;color:#f3efff;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:#a59dcf}
.stat.hot b{color:#ffb070}
.dock{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(640px,calc(100% - 32px));background:var(--panel);border:1px solid var(--panel-line);border-radius:22px 22px 22px 8px;padding:16px 18px 14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);color:var(--ink);box-shadow:0 18px 50px rgba(3,2,15,.45)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;border:0}
.presets legend{font-size:13px;color:var(--muted);margin-bottom:8px;padding:0}
.chip{appearance:none;border:1px solid var(--panel-line);background:transparent;color:var(--ink);font:500 14px/1 Figtree,system-ui,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--lilac)}
.chip[aria-checked="true"]{background:var(--lilac);color:var(--lilac-ink);border-color:var(--lilac)}
.sliders{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 18px}
label.s{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.s .row{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
label.s output{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--lilac);height:22px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{appearance:none;border:1px solid var(--panel-line);background:transparent;color:var(--ink);font:600 14px/1 Figtree,system-ui,sans-serif;padding:10px 15px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--lilac);color:var(--lilac-ink);border-color:var(--lilac)}
.btn[aria-pressed="true"]{border-color:var(--lilac);box-shadow:inset 0 0 0 1px var(--lilac)}
.btn:hover{border-color:var(--lilac)}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.spawnsel{margin-left:0}
select{font:500 14px Figtree,system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid var(--panel-line);border-radius:10px;padding:7px 8px}
select option{color:#1d1640}
.modes{display:inline-flex;padding:3px;border:1px solid var(--panel-line);border-radius:12px;margin-bottom:12px;gap:2px}
.mode{appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px/1 Figtree,system-ui,sans-serif;padding:8px 16px;border-radius:9px;cursor:pointer}
.mode[aria-checked="true"]{background:var(--lilac);color:var(--lilac-ink)}
.spins{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sliders.three{grid-template-columns:repeat(3,1fr)}
.btn.small{font-size:13px;padding:8px 10px;font-weight:600}
[hidden]{display:none!important}
.inspect{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(300px,calc(100% - 32px));background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:14px 16px 12px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);color:var(--ink);box-shadow:0 18px 50px rgba(3,2,15,.45);font-size:13px}
.inspect h2{font:700 17px/1.2 Unbounded,"Arial Black",sans-serif;margin:0 24px 8px 0;letter-spacing:-.01em}
.inspect .x{position:absolute;top:8px;right:10px;appearance:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px}
.inspect .status{display:inline-block;margin:0 0 10px;padding:4px 10px;border-radius:999px;font-weight:600;background:rgba(150,220,170,.18);color:#9fe3b4}
.inspect .status[data-tone="hot"]{background:rgba(255,140,60,.2);color:#ffb070}
.inspect .status[data-tone="mend"]{background:rgba(140,190,255,.18);color:#a9cbff}
.inspect .status[data-tone="new"]{background:rgba(200,160,255,.2);color:#d6bdff}
.inspect .status[data-tone="gone"]{background:rgba(160,160,180,.18);color:#c8c4dc}
.inspect dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.inspect dt{color:var(--muted)}
.inspect dd{margin:0;font-variant-numeric:tabular-nums}
.spinctl{margin-top:12px;border-top:1px solid var(--panel-line);padding-top:10px}
.spinctl label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.spinctl .row{display:flex;justify-content:space-between;gap:8px}
.spinctl output{color:var(--ink);font-weight:600}
.spinctl .btns{display:flex;gap:8px;margin-top:8px}
.spinctl .btn:disabled{opacity:.45;cursor:not-allowed}
.stat.cool b{color:#b9d4ff}
:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
.toggle-dock{display:none}
.legend{margin-top:12px;font-size:12px;color:var(--muted)}
.lrow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:4px}
.lrow strong{color:var(--ink);font-weight:600;min-width:64px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lnote{margin:6px 0 0;max-width:72ch}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--lilac);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.lrow .thin{opacity:.6}
.lrow .avg{color:var(--ink);opacity:.75}
.bodies{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
.bodies label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bodies select{font-size:15px;font-weight:600;padding:7px 10px}
.bodies .vs{font-size:13px;color:var(--muted)}
@media (max-width:720px){
  .hud{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;flex-direction:column;gap:10px}
  .stats{text-align:left;gap:18px}
  .stat b{font-size:16px}
  .sub{display:none}
  .dock{left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:12px 14px;max-height:52vh;overflow-y:auto}
  .sliders,.sliders.three{grid-template-columns:1fr 1fr;gap:10px 16px}
  .presets{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 2px;padding:0 14px 4px;scrollbar-width:none}
  .presets legend{display:none}
  .chip{white-space:nowrap}
  .legend{display:block}
  .bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .bodies label{flex-direction:column;align-items:stretch;gap:4px}
  .bodies select{width:100%}
  .bodies .vs{display:none}
  .collapsible.extra{margin-top:12px}
  .dock.collapsed .extra{display:none}
  .bar{margin-top:10px}
  .btn{padding:9px 12px}
  .toggle-dock{display:inline-flex}
  .dock.collapsed .sel{display:none}
  .sel{margin-left:0}
  .inspect{top:calc(env(safe-area-inset-top,0px) + 120px);bottom:auto;left:10px;right:10px;width:auto}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Simulation of two planets made of particles colliding. Drag to move the view, right-drag to throw rocks."></canvas>
<div class="hud">
  <div>
    <h1 id="title">Planet collider</h1>
    <p class="sub" id="subtitle">Each dot is a chunk of rock pulling on every other chunk. Drag to look around, scroll to zoom, click to inspect, right-drag to spawn.</p>
  </div>
  <div class="stats" aria-live="off">
    <div class="stat"><b id="sTime">0.0 s</b><span id="lTime">since launch</span></div>
    <div class="stat"><b id="sN">0</b><span id="lN">particles</span></div>
    <div class="stat hot" id="stHot"><b id="sHot">300 K</b><span id="lHot">hottest now</span></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="modes" role="radiogroup" aria-label="What collides">
    <button type="button" class="mode" role="radio" aria-checked="true" data-mode="planets">Planets</button>
    <button type="button" class="mode" role="radio" aria-checked="false" data-mode="galaxies">Galaxies</button>
  </div>
  <div id="planetUI">
    <div class="bodies">
      <label>Target <select id="iTarget"></select></label>
      <span class="vs">hit by</span>
      <label>Impactor <select id="iImpactor"></select></label>
    </div>
    <fieldset class="presets" role="radiogroup" aria-label="Collision type" id="presets"></fieldset>
    <div class="collapsible extra">
      <div class="sliders">
        <label class="s" title="Impactor width compared with the target's. Picking bodies sets their real ratio; the slider snaps back to it."><span class="row">Impactor size <output id="oRatio"></output></span><input id="iRatio" type="range" min="-2" max="2" step="0.01"></label>
        <label class="s"><span class="row"><span id="lAngle">Impact angle</span> <output id="oAngle"></output></span><input id="iAngle" type="range" min="0" max="80" step="1"></label>
        <label class="s" title="Speed at contact, in multiples of the pair's mutual escape speed"><span class="row"><span id="lSpeed">Impact speed</span> <output id="oSpeed"></output></span><input id="iSpeed" type="range" min="0.8" max="3" step="0.05"></label>
        <label class="s"><span class="row">Time speed <output id="oTime"></output></span><input id="iTime" type="range" min="0.25" max="2.5" step="0.25"></label>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div id="galaxyUI" hidden>
    <div class="bodies">
      <label>Galaxy <select id="gTarget"></select></label>
      <span class="vs">meets</span>
      <label>Galaxy <select id="gImpactor"></select></label>
    </div>
    <fieldset class="presets" role="radiogroup" aria-label="Encounter type" id="gpresets"></fieldset>
    <div class="collapsible extra">
      <div class="sliders three">
        <label class="s" title="Distance between the two galaxy centres at their closest, if they were point masses"><span class="row">Closest approach <output id="oPeri"></output></span><input id="iPeri" type="range" min="0" max="4" step="0.05"></label>
        <label class="s" title="Speed at closest approach, in multiples of the escape speed there. Below 1 the galaxies are bound and will come back."><span class="row">Speed <output id="oGSpeed"></output></span><input id="iGSpeed" type="range" min="0.6" max="2" step="0.05"></label>
        <label class="s"><span class="row">Time speed <output id="oGTime"></output></span><input id="iGTime" type="range" min="0.25" max="2.5" step="0.25"></label>
      </div>
      <div class="spins">
        <button type="button" class="btn small" id="bSpinT" title="Which way the first galaxy's disk turns, compared with the way the pair orbit each other">First spins with orbit</button>
        <button type="button" class="btn small" id="bSpinI" title="Which way the second galaxy's disk turns, compared with the way the pair orbit each other">Second spins with orbit</button>
      </div>
      <div class="legend" id="glegend"></div>
    </div>
  </div>
  <div class="bar">
    <button class="btn primary" id="bRestart">Launch again</button>
    <button class="btn" id="bPause" aria-pressed="false">Pause</button>
    <button class="btn" id="bTrails" aria-pressed="false">Trails</button>
    <button class="btn" id="bFollow" aria-pressed="true">Following</button>
    <button class="btn" id="bThrow" aria-pressed="false" title="When on, dragging spawns the chosen object instead of moving the view (right-drag always spawns)">Spawn mode</button>
    <label class="sel spawnsel">Spawn <select id="iSpawn"></select></label>
    <label class="sel collapsible">Detail
      <select id="iDetail">
        <option value="1500">Light</option>
        <option value="2500">Normal</option>
        <option value="4200">Dense</option>
      </select>
    </label>
    <button class="btn toggle-dock" id="bDock" aria-expanded="true" aria-controls="dock">Fewer settings</button>
  </div>
</div>
<div class="inspect" id="inspect" hidden aria-live="polite">
  <button type="button" class="x" id="inClose" aria-label="Close">×</button>
  <h2 id="inName"></h2>
  <p id="inStatus" class="status"></p>
  <dl id="inRows"></dl>
  <div class="spinctl" id="inSpinBox" hidden>
    <label><span class="row">Spin <output id="inSpinOut"></output></span>
      <input type="range" id="inSpin" min="-1.5" max="1.5" step="0.01" aria-label="Spin speed, as a fraction of break-up speed; left is backwards"></label>
    <div class="btns"><button type="button" class="btn small" id="inStop">Stop spin</button><button type="button" class="btn small" id="inReal">Real spin</button></div>
  </div>
</div>
<script>
const Sim = (() => {
  const MAXN = 14000;
  const P = {
    r: 3, K: 2.0e5, alpha: 1.0, beta: 2.0, G: 1000, theta: 0.85,
    heatScale: 1 / 14000, coolTau: 7
  };
  let N = 0;
  const x = new Float64Array(MAXN), y = new Float64Array(MAXN);
  const vx = new Float64Array(MAXN), vy = new Float64Array(MAXN);
  const ax = new Float64Array(MAXN), ay = new Float64Array(MAXN);
  const m = new Float64Array(MAXN), heat = new Float64Array(MAXN);
  const mat = new Uint8Array(MAXN), pid = new Uint8Array(MAXN);
  const rad = new Float64Array(MAXN), rb = new Float64Array(MAXN);
  const uid = new Uint32Array(MAXN); let nextUid = 1; // permanent id per particle (indices shift when particles are removed)
  const kf = new Float64Array(MAXN).fill(1); // pressure stiffness factor (stiffer for bodies bigger than the scene's own)
  const gxa = new Float64Array(MAXN), gya = new Float64Array(MAXN);
  let gravDirty = true;

  // ---- Barnes-Hut quadtree (flat arrays) ----
  const MAXNODES = MAXN * 6;
  const nx0 = new Float64Array(MAXNODES), ny0 = new Float64Array(MAXNODES), ns = new Float64Array(MAXNODES);
  const child = new Int32Array(MAXNODES), body = new Int32Array(MAXNODES);
  const nm = new Float64Array(MAXNODES), ncx = new Float64Array(MAXNODES), ncy = new Float64Array(MAXNODES);
  const nextB = new Int32Array(MAXN);
  const stack = new Int32Array(1024);
  let nodeCount = 0;

  function initNode(n, x0, y0, s) { nx0[n] = x0; ny0[n] = y0; ns[n] = s; child[n] = -1; body[n] = -1; nm[n] = 0; ncx[n] = 0; ncy[n] = 0; }
  function quad(n, i) { const h = ns[n] * 0.5; return (x[i] >= nx0[n] + h ? 1 : 0) + (y[i] >= ny0[n] + h ? 2 : 0); }

  function insert(i) {
    let n = 0;
    for (;;) {
      if (child[n] === -1) {
        if (body[n] === -1) { body[n] = i; nextB[i] = -1; return; }
        if (ns[n] < 0.05 || nodeCount + 4 > MAXNODES) { nextB[i] = body[n]; body[n] = i; return; }
        const c = nodeCount; nodeCount += 4; child[n] = c;
        const h = ns[n] * 0.5;
        for (let q = 0; q < 4; q++) initNode(c + q, nx0[n] + (q & 1) * h, ny0[n] + (q >> 1) * h, h);
        const old = body[n]; body[n] = -1;
        const qo = quad(n, old); body[c + qo] = old; nextB[old] = -1;
      }
      n = child[n] + quad(n, i);
    }
  }

  function buildTree() {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (let i = 0; i < N; i++) {
      if (x[i] < minx) minx = x[i]; if (x[i] > maxx) maxx = x[i];
      if (y[i] < miny) miny = y[i]; if (y[i] > maxy) maxy = y[i];
    }
    const s = Math.max(maxx - minx, maxy - miny) * 1.0001 + 1;
    nodeCount = 1; initNode(0, minx, miny, s);
    for (let i = 0; i < N; i++) insert(i);
    for (let n = nodeCount - 1; n >= 0; n--) {
      let M = 0, cx = 0, cy = 0;
      if (child[n] === -1) {
        for (let j = body[n]; j !== -1; j = nextB[j]) { M += m[j]; cx += m[j] * x[j]; cy += m[j] * y[j]; }
      } else {
        const c = child[n];
        for (let q = 0; q < 4; q++) { const mm = nm[c + q]; M += mm; cx += mm * ncx[c + q]; cy += mm * ncy[c + q]; }
      }
      nm[n] = M; if (M > 0) { ncx[n] = cx / M; ncy[n] = cy / M; }
    }
  }

  function gravity() {
    const G = P.G, th2 = P.theta * P.theta;
    for (let i = 0; i < N; i++) {
      const xi = x[i], yi = y[i], eps2 = rad[i] * rad[i];
      let gx = 0, gy = 0, sp = 0;
      stack[sp++] = 0;
      while (sp > 0) {
        const n = stack[--sp];
        if (nm[n] === 0) continue;
        if (child[n] === -1) {
          for (let j = body[n]; j !== -1; j = nextB[j]) {
            if (j === i) continue;
            const dx = x[j] - xi, dy = y[j] - yi;
            const d2 = dx * dx + dy * dy + eps2;
            const f = G * m[j] / (d2 * Math.sqrt(d2));
            gx += f * dx; gy += f * dy;
          }
        } else {
          const dx = ncx[n] - xi, dy = ncy[n] - yi;
          const d2 = dx * dx + dy * dy;
          if (ns[n] * ns[n] < th2 * d2) {
            const dd = d2 + eps2;
            const f = G * nm[n] / (dd * Math.sqrt(dd));
            gx += f * dx; gy += f * dy;
          } else if (sp < 1020) {
            const c = child[n];
            stack[sp++] = c; stack[sp++] = c + 1; stack[sp++] = c + 2; stack[sp++] = c + 3;
          }
        }
      }
      gxa[i] = gx; gya[i] = gy;
    }
    // The tree's approximations leave a tiny net self-pull, which would make a lone planet creep
    // across space (and leave its rings behind). Removing it restores momentum conservation.
    let M = 0, sx = 0, sy = 0;
    for (let i = 0; i < N; i++) { M += m[i]; sx += m[i] * gxa[i]; sy += m[i] * gya[i]; }
    if (M > 0) { sx /= M; sy /= M; for (let i = 0; i < N; i++) { gxa[i] -= sx; gya[i] -= sy; } }
  }

  // ---- contacts via spatial hash ----
  let H = 1 << 13;
  let cellStart = new Int32Array(H + 1), order = new Int32Array(MAXN);
  const ph = new Int32Array(MAXN), pcx = new Int32Array(MAXN), pcy = new Int32Array(MAXN);
  const hv = new Int32Array(9);
  function hash(cx, cy) { return ((Math.imul(cx, 73856093) ^ Math.imul(cy, 19349663)) >>> 0) & (H - 1); }

  // ---- fluid forces: SPH with number-density pressure ----
  // Each particle's pressure comes from how crowded it is compared with rest spacing. Using number
  // density (not mass density) keeps sharp boundaries between dense iron and light rock or gas,
  // and lets heavy material sink and light material float, as it does inside real planets.
  const HF = 2.2;                         // smoothing length = HF × particle radius
  let relV2 = 0;                          // largest squared speed between nearby particles (last step)
  const nn = new Float64Array(MAXN), pr = new Float64Array(MAXN), n0 = new Float64Array(MAXN);

const keysDown = new Set();

function syncInputs() {

// ---------- body pickers & legend ----------

{ // what the spawn tool makes
